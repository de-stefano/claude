<script>
const TEXT="<h1>India: Cominciamo con alcuni numeri… l’India è ancora povera</h1><p>Tiziano Terzani, un giornalista italiano, deceduto da poco tempo, che è vissuto per molti anni in India, racconta come spesso amici e conoscenti gli chiedessero perché aveva deciso di trasferirsi a vivere in India… confessava che all’inizio non sapeva mai che cosa rispondere… forse anche lui non sapeva bene perché mai avesse preso quella decisione nella sua vita… poi un giorno ha trovato una risposta plausibile… “Sono andato a vivere in India perché lì si può imparare a morire” ed allora gli amici preoccupati gli chiedevano se era ammalato… e lui di rimando: “Sì, lo sono… di mortalità!”… aveva uno spirito acuto Terzani, ma quello che voleva dire, oltre al fatto che tutti noi dobbiamo morire, è che in India la morte si vede ogni giorno per strada, è una esperienza quotidiana, purtroppo… e ci si impara a convivere.</p><p>L’India è additata come uno dei Paesi emergenti della nuova economia, ma i numeri strabilianti che sta producendo in questi ultimi anni per quanto riguarda il Pil, non possono nascondere il livello di povertà da cui è partita… ancora tanta strada resta da fare!</p><p>Andiamo per esempio a controllare il suo Indice di Sviluppo Umano: 0,62… un dato certo non ancora confortante, se pensiamo che i Paesi del G8 si attestano su valori che vanno dallo 0,94 di Canada e Usa allo 0,80 della Russia.</p><p>Ma anche Paesi non considerati tra quelli più sviluppati superano attualmente l’India… per esempio tutto il Nord Africa (Marocco, Tunisia, Algeria, Libia, Egitto) che si attesta su valori attorno allo 0,70, oppure Paesi del Sud America che registrano valori dello 0,75… certo l’India è un Paese di 1 miliardo e 200 milioni di persone e quindi questi paragoni con Stati “piccoli” forse non sono del tutto corretti, ma il dato non esaltante resta.</p><p>Ancora qualche dato… la speranza di vita in India è di 69 anni, quando in Italia, per esempio, è di 83 anni, in Cina è di 76 anni, negli Usa è di 78 anni.</p><p>La mortalità infantile è del 7% quando nei Paesi del G8 non arriva allo 0,5%.</p><p>La povertà sta diminuendo a vista d’occhio ma l’India sino a pochi decenni or sono era uno dei Paesi più poveri al mondo… così oggi possiamo dire che il 75% della popolazione che vive con due dollari al giorno è anche un buon risultato visto il passato, ma… sono sempre 3 Indiani su 4 che vivono in situazione di estrema indigenza… l’India resta la nazione con il più ampio esercito di persone denutrite, la metà dei bambini sono sottopeso per la loro età… solo il 43% di essi riceve le vaccinazioni indispensabili, il 58% è affetto da diarrea cronica.</p><h2>Un po’ di lessico…</h2><p>Indice di Sviluppo Umano: se si dovesse calcolare la “ricchezza” di un Paese solamente con quanto produce in termini economici (Prodotto Nazionale Lordo-PNL), ciò non renderebbe chiaramente l’idea di come vive la popolazione di uno Stato… se si produce molto ma la ricchezza finisce nelle tasche di pochi o dei grandi gruppi affaristici… se uno Stato non investe in Istruzione, Sanità e sistema pensionistico… beh… quel Paese produrrà anche tanto ma la popolazione resta povera… allora gli studiosi di economia hanno appunto elaborato questo nuovo parametro, l’Indice di Sviluppo Umano che tiene conto non solo del PNL pro capite (cioè diviso per tutta la popolazione), ma anche di altri due fattori: la speranza di vita ed il grado di alfabetizzazione.</p><p>Poi con calcoli complessi riescono ad estrarre un punteggio che va da 0 ad 1… i Paesi che si pongono tra lo 0,80 ed 1 sono i più ricchi del mondo… i Paesi che si posizionano tra 0,79 e 0,50 sono Paesi in via di sviluppo o di medio sviluppo umano… i Paesi che si posizionano sotto lo 0,50 sono Paesi a basso sviluppo umano (i Paesi del quarto mondo).</p><p>G8: termine molto usato in economia ma anche da giornali e telegiornali… l’acronimo significa “Group of eight”… il gruppo degli 8 Paesi più industrializzati del mondo… essi sono: Usa- Giappone- Germania- Gran Bretagna- Francia- Italia- Canada e Russia… a dire il vero questa classifica non rispetta precisamente la capacità produttiva dei diversi Stati, altrimenti bisognerebbe inserire la Cina che è ormai al primo posto al mondo per ricchezza prodotta, ed anche l’India… sono inseriti, invece, i principali Stati europei oltre ai colossi Usa, Canada e Giappone… si tratta di scelte politiche, anche strategiche a livello di alleanze militari… un tempo si parlava di G7, poi si è desiderato inserire anche la Russia, forse per “premiarla” del fatto che si era avvicinata politicamente agli Usa e aveva abbandonato da anni l’economia comunista per abbracciare l’economia capitalista.</p><p>La storia moderna dell’India… per capire molti aspetti della società attuale</p><p>In India si susseguirono storicamente prima un dominio di dinastie indù, poi di dinastie islamiche. Gli attriti tra queste due religioni non sono mai stati del tutto superati e risolti.</p><p>Gli Inglesi iniziarono la loro penetrazione nella penisola indiana attorno al 1750… all’inizio però fu una penetrazione solo economica attraverso la Compagnia Commerciale delle Indie Orientali… piano piano acquistano i porti principali del Paese… Madras, Bombay sulla costa occidentale e poi Calcutta nel golfo del Bengala ad est… naturalmente per difendere i loro interessi commerciali si</p><p>dotano di un esercito di soldati provenienti dall’Inghilterra, cui si aggiungono soldati reclutati sul posto.</p><p>Gli Inglesi commerciano proficuamente… acquistano materie prime a buon mercato che portano in Inghilterra e poi rivendono in India i prodotti lavorati e finiti dalle fabbriche inglesi.</p><p>In questo periodo il loro interesse è solamente economico e non si interessano minimamente ad aspetti religiosi… a differenza di altri colonizzatori europei essi non tentano minimamente di convertire gli Indiani alla loro religione.</p><p>Questo periodo sostanzialmente tranquillo e pacifico si interrompe nel 1857, che è una data fatidica per l’India… in questo anno si verifica la rivolta dei SEPOYS (i soldati indiani sotto comando inglese).</p><p>La rivolta del 1857 lascia conseguenze durevoli. Si apre un capitolo diverso nella storia coloniale. La Compagnia delle Indie Orientali deve farsi da parte, il governo dell’India viene trasferito direttamente alla regina d’Inghilterra. Ha inizio il Raj britannico, cioè l’amministrazione imperiale affidata ad un viceré nominato da Londra.</p><p>Ma vediamo come era nata e si era svolta la famosa rivolta dei Sepoys, perché è abbastanza curiosa nella sua dinamica.</p><p>Gli inglesi decidono di dare in dotazione ai fucilieri del Bengala nuove carabine il cui uso richiede una manipolazione particolare: occorre strappare con i denti l’estremità di ogni cartuccia per caricarla in canna. Vera o falsa, si diffonde tra i soldati la convinzione che le cartucce siano oliate con grasso di maiale o di bue. Mordere quel grasso è un gesto impuro per gli indù e per i mussulmani. L’indignazione per l’oltraggio alla religione è la causa di una rivolta che porta i Sepoys a una strage di inglesi nel nord dell’India… gli inglesi faticano ben un anno per riprendere il comando della zona ed anche essi si lasciano alle spalle una bella scia di morti, violenze e sangue.</p><p>Alla fine la rivolta è domandata ma, come dicevamo, è finita anche un’epoca… quella del dominio britannico solo attraverso il commercio della sua Compagnia Commerciale delle Indie Orientali… da adesso in poi sarà il potere politico a prendere il comando delle operazioni, instaurando una dominazione coloniale avida di denaro, inflessibile, separatista (apartheid) e razzista.</p><p>Un numero dice tutto… nel 1600, quando viene fondata la Compagnia delle Indie, il Pil dell’Inghilterra era appena l’1,8% di quello mondiale, quello indiano rappresenta invece il 22%… tre secoli dopo il Pil inglese era salito al 9% di quello mondiale mentre l’India era precipitata nelle condizioni di un paese povero, stremato da carestie ricorrenti.</p><h2>Lasciti positivi del colonialismo</h2><p>Comunque per ammissione degli stessi Indiani il dominio coloniale inglese lasciò anche alcuni aspetti positivi, di cui si sono giovati in epoca recente… 1) la costruzione della più grande ferrovia del tempo, sulla cui ossatura nascerà il trasporto via terra utilizzato anche modernamente; 2) la costruzione di un sistema di amministrazione del territorio capillare ed efficientissimo, grazie ad un numero elevatissimo di funzionari britannici, i quali, a loro volta, istruiscono i funzionari indiani… nasce una classe di amministratori locali, parlante inglese ed istruita al governo secondo tecniche di efficiente modernismo; 3) le riforme in campo sociale perché gli inglesi non accettano la discriminazione della donna ed aboliscono il “rogo delle vedove” ed i “matrimoni delle bambine”… su queste riforme torneremo nelle pagine seguenti; 4) la democrazia, nel senso della abitudine ad un sistema di governo basato su regolari votazioni e sul controllo degli eletti da parte del popolo; 5) la lingua inglese, diffusa su gran parte del territorio, tanto che oggi si può dire che l’India, con 350 milioni di abitanti che parlano un inglese fluente, ha una manodopera anglofona più grande dell’intera popolazione di Stati Uniti e Canada messi assieme.</p><h2>L’indipendenza dagli inglesi… i figli della mezzanotte, ferragosto 1947</h2><p>“Molti anni fa fissammo un appuntamento col destino e ora giunge il momento di tenere l’impegno… allo scoccare della mezzanotte mentre il mondo dorme l’India si sveglierà alla vita e alla libertà”… queste sono le parole con cui il nuovo premier indiano, Nehru, annuncia l’indipendenza dell’India dall’Inghilterra, un discorso che resterà scolpito nella memoria dei popoli del Terzo Mondo… ma a presenziare a questo discorso manca forse la persona più importante, il Mahatma (“grande anima”) Gandhi… eppure tutto era cominciato proprio da lui.</p><p>Laureato in diritto a Londra, Gandhi grazie all’istruzione anglosassone, entra a far parte di quella schiera di Indiani istruiti e cosmopoliti. Asceta, vegetariano rigoroso, studioso delle religioni, per vent’anni si è addestrato alla lotta per i diritti civili difendendo gli immigrati indiani in Sudafrica… egli fa politica in modo diverso, attraverso la “non violenza” e la “resistenza passiva”… i suoi metodi ispirano le battaglie dei neri americani di Martin Luther King, la lotta contro l’Apartheid in Sudafrica di Nelson Mandela, il pacifismo del Dalai Lama.</p><p>Rientrato in India nel 1915 comincia ad utilizzare i metodi di lotta politica che ha già collaudato in Sudafrica: scioperi fiscali, disobbedienza civile, marce pacifiche, boicottaggio delle importazioni made in England, digiuni ad oltranza… gli inglesi sono spiazzati… ogni volta che rispondono con la forza e la violenza i dominatori coloniali si mettono dalla parte del torto. Un trionfo della non violenza è la “PROTESTA DEL SALE” del 1930: Gandhi guida una marcia di popolo per 350 chilometri fino alla costa, dove fa bollire l’acqua di mare per contestare l’iniquo monopolio fiscale su un genere di prima necessità indispensabile ai contadini… durante la Seconda Guerra Mondiale sarà il movimento “Quit India” (abbandonate l’India) a dare il colpo di grazia al Raj britannico.</p><h2>Nasce il Pakistan</h2><p>C’è però un’ombra nel successo di Gandhi… il suo partito (il Partito del Congresso) non sfonda tra i musulmani… egli ottiene solo i voti degli indù nelle elezioni del 1946 e gli Inglesi, prima di andarsene, accettano la PARTIZIONE, cioè la secessione delle regioni a maggioranza musulmana e la nascita del futuro Pakistan… a quel punto scoppia la tragedia che insanguina l’indipendenza… le due religioni sono del tutto mescolate in gran parte del Paese… in ogni città ci sono quartieri indù e quartieri islamici… vi saranno stragi e misfatti da entrambe le parti… alla fine il bilancio è di un milione di morti e undici milioni di persone che scappano da una zona all’altra del Paese, ove sanno che la propria religione è maggioranza. Gandhi attraversa tutta l’India cercando di placare gli animi e portare conforto ora agli indù ora agli islamici, ma senza successo… nel tentativo estremo di evitare la Partizione del Pakistan propone di non nominare Nehru, suo discepolo, a premier, essendo egli indù, ma il capo dei musulmani… la sua idea non viene neppure presa in considerazione… tutte queste vicende avvengono nell’anno precedente al ferragosto del 1947, anno dell’indipendenza… ed è per questo che quella sera Gandhi, invece di festeggiare, è assente, rinchiuso a casa sua a digiunare… l’ultima battaglia che egli vince attraverso altri digiuni e preghiere è quella di costringere l’India a dare al Pakistan la sua quota di denaro, ereditato dagli inglesi che abbandonavano la penisola… pochi mesi dopo la “vendetta” della storia nel modo più assurdo che si possa immaginare… Gandhi viene assassinato da un indù fanatico (quindi della sua stessa religione), che lo accusa di essere stato troppo tenero con i musulmani.</p><p>Il Pakistan nasce come Stato religioso e teocratico, “patria” dei musulmani indiani.</p><p>Se il rapporto tra India e Pakistan, come Stati separati, è stato da sempre difficoltoso, il rapporto tra indù (80% della popolazione) e musulmani (14% della popolazione) all’interno dell’India, ha avuto degli alti e bassi… ne parleremo più avanti in queste fotocopie, quando affronteremo i problemi ancora aperti della politica e gli avvenimenti più recenti.</p><p>Teocrazia: sistema di governo nel quale l’autorità politica è nelle mani del potere religioso; la politica ubbidisce al volere ed alle imposizioni della religione… anzi sono la stessa cosa… chi governa la religione governa anche lo Stato… la definizione contraria è Stato laico… ove c’è netta separazione tra idee religiose e governo di uno Stato… i due poteri si rispettano ma non influiscono uno con l’altro.</p><h2>La potenza giovane… continuiamo con altri numeri</h2><p>Se l’India fosse solo ciò che abbiamo detto sino ad ora, non avrebbe senso il neologismo tanto in voga tra gli economisti moderni, cioè quello della nuova superpotenza dell’economia rappresentata da CINDIA, cioè Cina + India.</p><p>Allora vediamo questi altri numeri che dipingono un’India del tutto diversa e molto più positiva…</p><p>• Negli ultimi 25 anni l’India è riuscita a sollevare dalla miseria ogni anno 1% della sua popolazione così che già 200 milioni di Indiani hanno sconfitto per sempre la fame ed il bisogno;</p><p>• La crescita del PIL ha raggiunto ormai il tasso del 6% annuo, in Italia siamo sotto allo 0% (2019/20);</p><p>• La sua crescita demografica porterà l’India ad essere il Paese più popoloso del mondo nel giro di vent’anni (1 miliardo e 600 milioni di persone), ma anche il più giovane!</p><p>• Il 70% degli abitanti dell’India ha meno di 35 anni… 200 milioni sono i giovani compresi tra 15 e i 24 anni… è un paese con idee nuove, voglia di vivere, innovazione nelle vene… è un paese “teenager”… mentre gli altri Stati, compresa la Cina, tra pochi anni avranno tantissimo denaro da spendere per i loro pensionati, l’India non avrà ancora questo problema! La differenza tra popoli vecchi e giovani balza agli occhi… quando si va a fare compere a Londra nei supermarket, i reparti più forniti sono quelli che vendono prodotti per anziani, mentre un grande magazzino di New Delhi è tutto rivolto a bambini e teenager.</p><p>• La CIA (Central Intelligence Agency… Agenzia Centrale dello Spionaggio americano) ha predetto che l’India nei prossimi anni diventerà la terza potenza mondiale, assieme a Cina e Stati Uniti… e se lo dice la CIA c’è da crederci, visto che sono abbastanza sciovinisti!</p><p>Sciovinismo: significa nazionalismo esagerato e fanatico… deriva da Chauvin, un soldato di Napoleone, famoso per il suo ingenuo patriottismo esagerato.</p><h2>La forza dell’India… dove sono finite le mucche?</h2><p>La potenza giovane vuol dire fantasia, coraggio, intraprendenza, fiducia nel futuro… gli Indiani oggi non sembrano aver paura di nulla ed hanno una estrema fiducia nelle proprie possibilità… ed hanno ragione, come vedremo non appena analizzeremo le loro capacità in campo scolastico e nella ricerca universitaria.</p><p>Sono sparite le vacche dalle strade di New Delhi, eppure c’erano ancora nel 2003, placide, indisturbate, si aggiravano tra le file dei taxi nella bolgia dei viaggiatori in arrivo all’aeroporto… come è avvenuto tutto ciò? Si sa che le mucche sono sacre per gli indù però, come ha fatto notare qualcuno, non per questo devono anche essere invadenti! Infatti il motivo per cui esse “pascolavano” in mezzo alla città (una immagine tipica e folcloristica dell’India di un tempo) non era per nulla religioso, bensì economico… erano vacche “randagie”, che i proprietari non accudivano più perché avevano smesso di produrre latte o ne producevano troppo poco… e non valeva più la pena di mantenerle… così si lasciavano allo stato brado e che ci pensasse la comunità o l’immondizia e i rifiuti a sfamarle… il sindaco aveva provato a risolvere questo problema… nel 2004 aveva introdotto una “taglia sulle vacche”… fu un fiasco… i proprietari facevano i furbi: mandavano dei ragazzini a consegnare le randagie per incassare la ricompensa… poi si facevano restituire gratis il bovino sporgendo denuncia per furto ed il trucco poteva ricominciare all’infinito.</p><p>La soluzione finale l’ha trovata un genio informatico di 35 anni, che ha brevettato un microchip da far inghiottire alla vacca; il minuscolo sensore si fissa nello stomaco del ruminante e da lì non si sposta più… consente di attribuire ad ogni mucca di New Delhi la sua carta di identità e di risalire al proprietario… e di multarlo se la vacca si sdraia davanti ad un semaforo o sulla corsia di una superstrada! Questo microchip è stato un successo mondiale ed è stato utilizzato anche in Usa, Argentina ed Europa per tenere sotto controllo i bovini e prevenire il ritorno del morbo della mucca pazza.</p><h2>La scuola e l’Università… Matematica, Fisica, Informatica ed Ingegneria</h2><p>1000 $ per un ingegnere indiano contro i 5000 $ per uno statunitense</p><p>In America ed in Europa la gente risparmia prima di tutto per mettere via un gruzzolo per la pensione, in India la prima finalità del risparmio è l’istruzione dei figli (come in Cina d’altronde)… il voto in matematica ed in inglese per le nuove generazioni rappresenta la via d’uscita dalla povertà… in India fin dalle scuole elementari sono famose le gare di matematica… i ragazzi si allenano tutto l’anno per un piazzamento nel campionato di algebra ed equazioni, che rimarrà scritto nel loro curriculum vitae e potrà forse servire più tardi a guadagnare l’accesso a una delle superfacoltà. Ma gli Indiani sono ormai famosi da anni nei campi scientifici… anche all’estero, anzi soprattutto all’estero… il 36% dei matematici della NASA è indiano e addirittura il 12% degli scienziati di tutte le facoltà statunitensi!</p><p>L’Università di Harvard negli Stati Uniti, una delle più famose al mondo, è una scelta di ripiego per quelli che non sono riusciti ad entrare all’Indian Institute of Science di Bangalore (I.I.S.), spiega il professor Nandy… la nostra è l’accademia scientifica più selettiva al mondo… la selezione è quasi disumana! Per ogni dottorato di ricerca all’Iis gareggiano migliaia di superlaureati usciti da cinque grandi politecnici indiani (e pensare che questi superlaureati sarebbero già ambiti dalle facoltà statunitensi)… tra di loro a Bangalore se ne scremano solo 300, che devono superare una settimana di interrogatori davanti a tutti i docenti… alla fine della strage gli eletti saranno solo 5 su 300!!! Ma questi studenti hanno un privilegio raro… studiare nella facoltà migliore al mondo… in totale sono 3000 giovani con 1000 docenti a disposizione, cioè un docente ogni 3 studenti… sono i geni dell’informatica… sono mantenuti a spese del governo indiano ma arrivano a raffica anche borse di studio pagate dalle multinazionali più famose al mondo… Hewlett-Packard, Phillips, Microsoft, Motorola, Google etc. è questo il futuro dell’India… la sua capacità di avere i migliori studenti al mondo nei campi dell’economia più moderna… l’economia che progetta e che ha bisogno di ingegneri, informatici, matematici… e, non dimentichiamolo, come è per la Cina, questi super tecnici sono giovani che vivono in un Paese ancora in via di sviluppo per cui… costano poco… pochissimo… un ingegnere indiano costa 1000 dollari al mese quando un ingegnere statunitense ad una ditta ne costa 5000!</p><h2>I geni dell’economia invisibile… to Bangalore</h2><p>L’informatica, come applicazione ad attività economiche e per lo sviluppo di software, è nata negli Stati Uniti circa 40 anni fa in California, nella Silicon Valley… lì gente come Bill Gates cominciò la sua carriera… oggi la nuova Silicon Valley è nel sud dell’India, nella città di Bangalore… questa città ha avuto un boom economico mai visto negli ultimi 10 anni ed è diventata una metropoli di 8 milioni di abitanti… ma niente ciminiere fumanti o code di tir… a Bangalore non si produce niente di materiale… qui si fabbricano solo “soluzioni”, concetti, programmi e linguaggi per i software… qui si progetta il nuovo motore di ricerca per Google o i software per i nuovi videotelefonini… l’India non ha avuto in passato i soldi ed i capitali per investire in industrie… loro stessi si definiscono dei nani per quanto riguarda l’Hardware (la costruzione dei computer, dei telefonini, delle videocamere)… quelli si costruiscono in Cina… loro sono dei giganti nelle idee e nel pensiero… sono il numero uno al mondo nel campo del software…</p><p>La fortuna di Bangalore è stata l’ondata di panico che invase l’America e l’Europa nel 1999 quando si stava avvicinando il Baco del Millennio e la temuta catastrofe informatica… tutti i computer in commercio erano stati programmati per gestire l’orologio interno sino al 1999… che sarebbe accaduto se i software all’arrivo del 2000 si fossero resettati al 1901… che sarebbe accaduto ai conti in banca, ai prestatiti ed ai crediti delle grandi industrie, agli investimenti in Borsa etc? Bisognava aggiornare i programmi dei computer entro il 31 dicembre del 1999… la via di salvezza fu Bangalore… migliaia di piccole aziende informatiche misero a disposizione delle banche di Wall Street, delle compagnie aeree e di chi altro ne avesse bisogno, i loro tecnici indiani… ad ogni ora del giorno e della notte risolvevano i problemi e placavano le ansie, rispondendo a tutti i quesiti… via internet ed e-mail essi erano sempre a disposizione… competenti, super competenti, a basso costo e… rispondevano in inglese, perché dopo la colonizzazione britannica l’inglese in India è un po’ la seconda lingua parlata fluentemente un po’ da tutti!!!</p><p>E così Bangalore è diventato anche un verbo inglese!!! To Bangalore significa “delocalizzare servizi informatici”… in India si trovano i migliori servizi al mondo al costo più basso!!!</p><p>Da quando gli Usa, ma anche le multinazionali di tutto il mondo, hanno scoperto Bangalore non l’hanno più abbandonata… Bangalore naturalmente è una metafora, oltre che il polo informatico più sviluppato del Paese, assieme a Hyderabad… l’India è stata nominata il futuro del mondo del software e della “economia impalpabile”… e per la prima volta dopo anni i NIR (Not Resident Indians) ritornano a casa, perché è qui il futuro… la “fuga dei cervelli”, che aveva spinto i migliori ricercatori indiani ad andare a studiare all’estero (soprattutto negli Usa) è finita… ora ritornano a lavorare in patria… i più giovani non partono più!!!</p><h2>L’India, la terra della delocalizzazione dei servizi…</h2><p>Delocalizzazione dei lavori intellettuali (buste paga, radiografie, traduzioni, stipula contratti, etc)</p><p>E non è finita qui, perché gli Indiani sono davvero dei giganti nel campo della nuova economia elettronica… e sanno come muoversi!</p><p>Corsi di “Neutralizzazione dell’accento” per far sì che l’inglese parlato da un operatore indiano sembri quello parlato da uno statunitense… quando chiamate una società di autonoleggio per affittare una autovettura a Los Angeles, o una catena di hotel internazionali per prenotare una camera, o il servizio di assistenza per il vostro computer, spesso dall’altra parte del filo a migliaia di chilometri di distanza, senza che voi lo sappiate, vi risponde un operatore o un’impiegata indiana… tramite internet e posta elettronica poi si può fare anche di più… il lavoro “intellettuale” si può fare in qualsiasi parte del mondo a qualsiasi ora… e così gli ospedali statunitensi spediscono le radiografie mediche via mail in India e medici indiani danno il responso… la dichiarazione dei redditi la può fare un commercialista di Bombay o di Bangalore, la contabilità delle buste paga, la traduzione di un testo, la preparazione di un contratto… tutto può essere delocalizzato perché è merce che non “pesa”… e, come abbiamo già detto, qui, in questa parte del mondo, costa poco!</p><p>Nel 2006 c’era una vignetta satirica, che girava su un giornale americano, la quale descriveva una bambina corrucciata di fronte al padre che la sgridava: “No, mi dispiace, non puoi delocalizzare i tuoi compiti in India!”… beh… vignetta superata! A New York, visti gli alti costi delle lezioni di ripetizione di matematica, i genitori di molti studenti si sono abbonati ad un servizio che offre l’assistenza dall’India via internet ai ragazzi in difficoltà con l’algebra… gli Indiani sono dei geni in matematica ed il servizio costa 25 dollari all’ora invece dei 100 di un professore statunitense!!!</p><h2>Un mondo economico dalla fantasia sfrenata… capitalismo con un’anima</h2><p>Quello che si sta cercando di fare in India è coniugare la logica del profitto, che sta alla base di ogni imprenditore capitalista, con la logica dello sviluppo in favore della popolazione… vi sono degli imprenditori indiani che sono ormai famosi nel mondo… e i loro business sono mirati non solo al mercato estero ma anche a quello interno, con un occhio naturalmente alla capacità d’acquisto assai ridotta del ceto medio indiano.</p><p>Uno di questi imprenditori è il signor Tata, figlio di una dinastia di imprenditori.</p><p>Il capostipite, Jamseti Tata, fu un grande innovatore, che costruì la prima centrale idroelettrica indiana, il primo cementificio, la prima industria tessile, la prima compagnia di navigazione, il primo impianto siderurgico… egli fu anche il primo nelle innovazioni a favore degli operai, perché voleva loro bene… istituì la giornata lavorativa di otto ore nelle sue fabbriche (mentre oggi in Cina se ne lavorano anche quattordici, per fare un confronto), introdusse l’assistenza per la maternità delle sue operaie… ed eravamo 100 anni or sono… capitalismo con un’anima dicevamo nel titolo… Jamseti Tata fondò una città vicino ai suoi stabilimenti e questa città oggi è stata designata dall’Onu come uno dei sei capolavori di pianificazione urbana mondiali… si tratta della città di Jamshedpur… “Le vie devono essere larghe e ariose, piene di alberi che diano ombra… che ci sia ampio spazio per giardini ed aiuole” lasciò scritto nel suo testamento. Oggi la città fornisce gratis alle famiglie dei dipendenti alloggi e scuole, ospedali ed impianti sportivi.</p><p>Ratan Tata, un suo discendente, che adesso ha in mano tutta l’azienda, ha mantenuto la stessa filosofia imprenditoriale… La Tata group è presente in diversi rami dell’economia, dalle auto all’informatica, dall’acciaio al turismo… ma tutto a misura d’uomo… uomo indiano… nella ricerca del profitto Ratan Tata segue una metodologia indiana: lo attira la parte bassa della società, vuole inventare prodotti e servizi adatti a paesi emergenti come il suo, dove il grosso del mercato si situa a livelli di reddito minimi… perciò ha disegnato e realizzato una automobile da 2000 euro, che è commercializzata in tutti i paesi asiatici e sta entrando nel mercato africano (chissà se non troverà anche fette di mercato in Europa o prima o poi…); il camioncino più diffuso in tutta l’India è il suo Ace, che costa meno di 4000 euro.</p><p>Allo stesso modo il gruppo lancia duecento motel Ginger in tutta l’India che offrono standard di igiene e pulizia impeccabili, bagni singoli, aria condizionata e internet, per meno di venti euro a notte… piano piano anche in India sta nascendo il sogno del turismo di massa, per noi cosa scontata ma non certo in un Paese che sino a pochi anni or sono era un paese da terzo mondo!</p><p>Un altro imprenditore indiano ha lanciato sul mercato una lavatrice da 50 euro, con memoria programmabile per neutralizzare i frequenti blackout elettrici.</p><p>Ma il capitalismo indiano non si ferma qui… da poco è stato lanciato sul mercato il primo computer da 70 euro… e se si vuole si può anche prenderlo in affitto: 7 euro al mese con annesso abbonamento ad internet, programmi, manutenzione ed assistenza gratuita se non dovesse funzionare qualcosa… nelle campagne, tagliate fuori dalle modernità delle città, sono state create minuscole edicole dotate di computer collegato ad una rete internet… all’edicola l’abitante delle zone più sperdute può fare di tutto: ordinare la patente di guida o un certificato di nascita, spedire una e-mail, fare delle fotocopie o delle foto d’identità, trovare una moto usata negli annunci online, perfino cercar moglie nei tanti siti matrimoniali.</p><h2>C’è anche l’altra economia, naturalmente… dagli aerei all’acciaio</h2><p>C’è anche l’altra economia, naturalmente… se no, un Paese non decolla… ed a proposito di decollo vediamo la KINGFISHER.</p><p>Europa ed America hanno spostato a Bangalore (guarda caso) la complessa progettazione dei nuovi Airbus 380 e del Boeing 787… il mercato dei trasporti aerei è in forte, fortissima espansione in India… il traffico passeggeri sta crescendo al ritmo del 50% all’anno.</p><p>In questo mercato si è lanciata la Kingfisher, una multinazionale indiana che si occupa del business della birra e delle bevande alcoliche… controlla il 60% del mercato indiano, il che equivale a dire che controlla il 10% del mercato mondiale.</p><p>Ma questa multinazionale, capitanata dalla famiglia Mallya, ha deciso di differenziare i propri investimenti, entrando nel mondo del trasporto aereo… partita con due apparecchi che facevano la spola due volte al giorno tra Bangalore e Bombay (oggi si chiama Mumbai), a venti mesi dalla nascita aveva già 24 apparecchi e 156 voli quotidiani, anche all’estero. Ora la Kingfisher è una delle prime compagnie ad avere ordinato ad Airbus il “gigante dei cieli”, ben 5 superjumbo A380 a due piani da 555 passeggeri… li metterà in servizio insieme con altri 20 Airbus A345, per inaugurare i primi voli nonstop fra India e Stati Uniti… e non congiungeranno le due capitali politiche, bensì le due Silicon Valley del pianeta: Bangalore- San Francisco.</p><p>Il signor Mittal, 55 anni, è il terzo uomo più ricco al mondo… chi avrebbe mai detto pochi anni fa che un indiano sarebbe stato il terzo miliardario del pianeta? Vive in giro per il globo, ma ha casa a Londra, la casa più costosa del mondo… l’ha comprata da Bernie Ecclestone, il padrone della Formula Uno… per il matrimonio di sua figlia ha speso 50 milioni di dollari intrattenendo in Francia, nel palazzo di Versailles, affittato per l’occasione, mille ospiti per cinque giorni… gli chef naturalmente li ha fatti venire direttamente da Calcutta, con voli privati!</p><p>Cosa fa nella vita il signor Mittal? Produce acciaio… il più grande impero siderurgico mondiale, 50 milioni di tonnellate di produzione annua, 200.000 dipendenti… e di recente ha acquistato la Arcelor, il gigante europeo dell’acciaio (una multinazionale nella quale sono presenti industriali e governi di Spagna, Francia, Belgio e Lussemburgo)… il signor Mittal non si ferma davanti a nulla e l’acquisto di questa multinazionale è stato un shock per noi europei che ci siamo sentiti “colonizzati”… la vendetta della storia… la più grande colonia al mondo nell’800 che oggi viene ad acquistare aziende in Europa!!!</p><p>La chiave del successo di Mittal sta proprio nell’essere una creatura di Cindia… è uno dei primi grandi imprenditori indiani ad essersi agganciato alla locomotiva economica cinese… nessuno lo aveva intuito prima… la produzione di acciaio nel mondo si è triplicata tra il 1970 ed il 2000… ci sono voluti insomma 30 anni… ultimamente la produzione dell’acciaio si è nuovamente triplicata, ma questa volta sono bastati 5 anni (dal 2000 al 2005)… nelle automobili che sfrecciano per Shangai e Pechino, nei grattacieli che sorgono come funghi in Cina, nelle fabbriche e nella edilizia di Honk Kong troviamo l’acciaio ed il ferro del signor Mittal… e dei suoi 200.000 dipendenti!</p><h2>Cina ed India… non tutto è uguale, anzi! La democrazia indiana ed il monopartitismo cinese</h2><p>Quali sono le differenze tra questi due nuovi giganti dell’economia asiatica? Innanzi tutto che uno è un po’ meno gigante dell’altro… l’India sta arrivando, ma la Cina è più avanti.</p><p>La Cina è diventata la “fabbrica” del mondo e si è specializzata nel manifatturiero, nel tessile, nella costruzione a basso prezzo di qualsiasi oggetto o bene di consumo… la Cina è hardware…</p><p>l’India si è specializzata nel fornire servizi, nel cosiddetto terziario di ultima generazione… l’India è software… ma la crescita dell’India, pur essendo prodigiosa per noi europei ed occidentali, arrivando al 6-9% del Pil annuo, è comunque più lenta di quella cinese… perché?</p><p>Perché in India, dicono gli analisti (studiosi) politici c’è la democrazia!!!</p><p>È la democrazia più grande al mondo… quando si vota in India le elezioni durano tre settimane e lo spoglio delle schede richiede 3 giorni… ci sono quasi 700 milioni di persone che devono andare a votare… in Italia sono circa 40 milioni.</p><p>Ed è una democrazia vera, non solo di nome… da quando c’è stata l’indipendenza si sono succeduti 13 governi e ben 6 volte i vecchi politici sono stati sostituiti e mandati a casa con un cambio di governo… qui ci sono diversi partiti politici, non uno solo come in Cina… in un Paese con l’80% della popolazione indù ben 3 presidenti della Repubblica sono stati di religione islamica… non c’è quindi neanche preclusione di tipo religioso…</p><p>La democrazia è una ricchezza perché è libertà… ed un popolo fatto di menti libere, che abbraccia una religione, l’Induismo, che predica lo spirito di tolleranza e di buona volontà per comprendere ed apprezzare il punto di vista dell&#x27;avversario… l’Induismo che predica che la verità possiede molteplici apparenze… beh.. un popolo così è difficile da irretire con un tipo di governo illiberale… ma la democrazia ha i suoi piccoli (o grandi) costi… ed in economia a volte si sente… quello che in Cina si decide in un attimo, perché lo decide il Partito comunista, qui in India deve passare attraverso il voto del Parlamento… ed i tempi possono essere lunghi… ed in Parlamento, fortunatamente, sono rappresentate le esigenze di diversi gruppi sociali… così se si vuole costruire una autostrada o un nuovo polo industriale in una data zona dell’India, espropriando terreni e proprietà private… beh… non è detto che il progetto vada in porto… in Cina sicuramente sì… e chi protesta rischia la repressione e l’intervento armato della polizia.</p><p>Dalla Cina l’India ha provato ad importare l’idea di creare “zone economiche speciali”, da espropriare ai contadini, per costruire industrie, fabbriche, poli di ricerca… ed attirare gli investitori stranieri, magari prevedendo in quella data zona la costruzione di strade ed autostrade nuove, porti, magazzini… introducendo vantaggi fiscali e meno tasse da pagare… non è stato facile… anzi… qui ci sono i sindacati che difendono i contadini, c’è la stampa libera che può tranquillamente attaccare i politici di turno, c’è la magistratura che può citare in tribunale eventuali abusi, lo sciopero è garantito… un esempio per tutti… vicino a Mumbai (Bombay) il colosso industriale Reliance per creare un parco tecnologico ha offerto 20.000 dollari per ogni parcella di terreno agricolo… questa è una delle 200 zone ad economia speciale previste dal governo… ma i contadini, che coltivando i loro appezzamenti non guadagnano più di 500 dollari all’anno, hanno detto di no perché 20.000 dollari sono tanti ma prima o poi finiranno… che cosa faranno i nostri figli senza terra?</p><p>E così il progetto per ora è stato fermato… tutto questo porta in alcuni casi ad un rallentamento dell’economia ma forse è anche meglio così… stiamo sempre parlando di una economia, quella indiana, che sta procedendo a tassi di crescita del 6-7% e più (2020)… se anche non raggiungono le prestazioni record dei vicini cinesi poco male… meglio qualche punto di percentuale in meno del Pil ed una società dove, se lo desidero, posso far sentire la mia voce… e sono sicuro che non resterà inascoltata!</p><h2>La Religione induista… solo alcuni cenni</h2><p>Con il termine &quot;induismo&quot; si indica l&#x27;intera esperienza religiosa degli Indiani nel suo svolgimento storico, fin dalle origini, fissate approssimativamente intorno al 1500 a.C.; alcuni preferiscono però parlare di induismo soltanto della religione che, praticata dal VI secolo a.C., costituisce l&#x27;evoluzione di due fasi precedenti dette rispettivamente &quot;vedismo&quot;, dal nome dei libri sacri, i Veda, e &quot;brahmanesimo&quot;, dal nome degli appartenenti alla casta sacerdotale, i brahmani.</p><p>L&#x27;induismo è definibile come una religione politeistica caratterizzata non solo dalla molteplicità delle figure divine, ma anche dal fatto che i fedeli si distinguono per la loro devozione ad un Dio particolare. Tra gli innumerevoli Dei, che sono adorati in templi a volte stupendi e immersi nella giungla, i più importanti sono Brahma, il dio creatore dell’universo, Visnu, il dio che conserva nell’essere il mondo, e Shiva, il dio che dissolve tutto.</p><p>I libri sacri, i Veda, sono venerati da una tradizione che impone di custodirne scrupolosamente l&#x27;integrità testuale.</p><p>Gli induisti credono nella reincarnazione: se un uomo si comporta male in questa vita, dopo la morte, la sua anima torna a vivere in un altro corpo per espiare i peccati commessi: solo chi onora gli dei e si comporta con carità verso gli altri uomini raggiunge la pace eterna. Infatti gli induisti credono che gli dei, in cambio di preghiere e di sacrifici, facciano dono agli uomini del paradiso di felicità.</p><p>L&#x27;induismo è noto per la rigida divisione della società in classi, meglio conosciute come CASTE, alle quali si appartiene per nascita senza alcuna possibilità di sfuggire alle severe norme di una concezione gerarchica.</p><p>Gli induisti in India sono composti da circa 950 milioni di fedeli.</p><h2>Le caste… ma non erano state abolite?</h2><p>Le caste in India sono parecchie e quelle conosciute in Occidente costituiscono solo una notevole semplificazione della situazione reale… infatti nei testi solitamente si parla di solo 4 caste, sotto alle quali ci sarebbero i Dalit o paria, gli intoccabili… in realtà ogni casta si suddivide in un numero spropositato di sottocaste… un esempio curioso: esiste anche la casta dei “pulitori di orecchie”. Al contrario di quanto è riportato su molti testi, le caste non sono state abolite per legge e sono una realtà concreta. Basti pensare che il nome della casta fa parte della firma di ogni individuo. L’appartenenza a una casta implica molte conseguenze pratiche, come l’imposizione di un certo regime alimentare: i brahmani, vale a dire i sacerdoti che appartengono alla categoria sociale più elevata, sono vegetariani perché devono mantenere la propria purezza, gli appartenenti ad altre caste possono mangiare solo carne bianca e i DALIT (pària, gli intoccabili), possono mangiare tutti i tipi di carne, anche considerata impura, purché non di animali sacri come la mucca. Vi sono però altri casi più curiosi: ad esempio gli incantatori di serpenti possono cibarsi anche di carne di serpente.</p><p>Il matrimonio è proibito tra individui di caste differenti e questa tradizione è ancora largamente rispettata, anche se tra i giovani piano piano stanno prendendo piede abitudini del tutto diverse… soprattutto tra gli Indiani che hanno vissuto all’estero, che all’estero si sono conosciuti con il futuro marito/moglie e che magari solo in un secondo tempo sono tornati a vivere in India… le nuove generazioni insomma stanno cambiando la tradizione che però è ancora molto radicata.</p><p>Formalmente comunque le caste erano state abolite con l’indipendenza dell’India… ma nel 1955 un censimento ne aveva contate oltre 2000 e nel 1980 il numero era aumentato sfondando la cifra di 3000… dal 1920 in India esiste l’AFFIRMATIVE ACT, una legge che cerca di attenuare gli effetti negativi di una società divisa tra classi agiate e classi povere… in pratica grazie a questa legge vi sono dei posti riservati nelle assunzioni nel pubblico impiego e nell’accesso alle Università: per le caste inferiori è garantito il 27% delle assunzioni nello Stato ed il 22% dei posti nelle scuole ed Università. Il sistema delle quote ha prodotto effetti paradossali… gli appartenenti alle categorie più sfavorite sono strenuamente favorevoli a questa forma di promozione socio- economica… per trarne vantaggio, però, devono dichiarare e rivendicare la propria appartenenza ad una casta inferiore… insomma stanno magari migliorando le condizioni economiche delle caste inferiori ma, per assurdo, questa legge ha rafforzato la tradizionale partizione della società che si voleva abolire sin dall’ormai lontano 1947.</p><h2>Le donne in India… alcune cose stanno cambiando… ma molto lentamente</h2><p>Per molti anni quando Sanghera tenta di rivedere sua madre si sente rispondere: “non chiamare più in questa casa, per noi tu sei morta”… i suoi fratelli quando la incontrano per strada fanno finta di non vederla… questo è il prezzo che Sanghera deve pagare per aver rifiutato il destino di molte ragazze indiane. A 15 anni i suoi genitori le avevano assegnato un marito molto più vecchio, che lei non aveva mai visto, e che l’avrebbe portata a vivere in una regione, il Punjab, di cui lei non conosceva neppure l’esistenza. Sanghera per evitare quel matrimonio forzato scappa di casa e alla ribellione aggiunge un altro “oltraggio” alla famiglia: si sceglie come partner un uomo di una casta inferiore alla sua!</p><p>Matrimoni decisi dai genitori senza neppure consultare i figli (e soprattutto le figlie), rigida endogamia all’interno dell’antichissimo apartheid sociale delle caste… in gran parte dell’India le cose stanno ancora così… ma ciò che più colpisce della storia di Sanghera è il luogo ove tutto ciò avviene: Derby, una cittadina inglese… perfino nelle famiglie indiane, trapiantate da anni in Occidente ed a contatto con la nostra cultura, diametralmente opposta su questi argomenti, all’interno delle comunità di emigrati il peso del passato è più forte di ogni altra influenza!</p><p>Ma c’è anche di peggio del matrimonio forzato nel destino di molte donne indiane… gli aborti selettivi che prendono di mira i feti di sesso femminile… il rapporto innaturale parla di 933 femmine nate ogni 1000 maschi mentre il numero dovrebbe essere di 1050 femmine su 1000 maschi… è uno squilibrio superiore perfino a quello della Cina… oltre agli aborti selettivi poi, le bambine soffrono di un tasso di mortalità molto più elevato tra il momento della nascita e l’età di cinque anni: muoiono di malnutrizione, mancanza di cure, negligenza, perché i genitori poveri danno la preferenza ai figli maschi. L’Unicef stima inoltre che ogni anno cinquemila donne indiane vengono assassinate tra le mura domestiche, dal marito o da qualche altro membro della famiglia, il più delle volte per liti legate all’ammontare della dote, anch’essa teoricamente messa fuori legge ormai da 60 anni.</p><p>Altro triste destino è quello delle vedove, secondo quanto impone la tradizione induista…</p><p>e ricordarsi che le bambine indiane vengono spesso promesse spose in tenera età, anche a 8-10 anni, a mariti a volte molto più anziani di loro, per cui rimanere vedove, anche giovani, non è una eventualità così remota!</p><p>“Una vedova deve soffrire fino alla morte, fino alla fine deve condurre una vita di castità e di privazioni… la vedova virtuosa che rimane casta dopo la morte del marito va in paradiso, la vedova infedele rinasce nel ventre di uno sciacallo”… così recitano le leggi della tradizione indù… e questa espiazione deve essere scontata negli Ashram, speciali monasteri di reclusione… ma finire i propri giorni in un ashram non era il peggiore dei destini per le vedove indiane… per secoli l’alternativa fu il SATI: morire bruciate vive sul rogo funerario del marito… una abitudine già messa al bando dagli inglesi nell’ottocento e di nuovo vietato dalle leggi indiane dopo l’indipendenza del 1947, eppure negli angoli più remoti delle campagne non è scomparso del tutto questo rito terribile… addirittura sembra che nel 2006 sia aumentato il numero dei suicidi delle vedove… un fenomeno tanto più sconcertante visto che le leggi puniscono severamente familiari, amici e testimoni del suicidio, e perfino le autorità comunali che non impediscono l’autoimmolazione… la spiegazione di queste tragedie sembra essere la miseria… una vedova nelle zone più tradizionaliste è condannata all’emarginazione, non trova lavoro, ha di fronte a sé un futuro di fame e disperazione… il suicidio sembra essere l’unica via di scampo!!!</p><p>Eppure qualcosa sta cambiando, seppure lentamente… l’India, in tutto, è il Paese delle contraddizioni ed anche in questo caso, quando parliamo di donne, possiamo trovare le tradizioni più retrograde come pure delle modernità inaspettate… pensate solo al fatto che l’India è stata la prima grande democrazia al mondo ad avere una donna a capo del suo governo, Indira Gandhi… nel luglio del 2007 è stata votata dal Parlamento per la prima volta un presidente dello Repubblica donna… a capo del più importante giornale indiano, “Times of India”, c’è una donna, come pure a capo della principale rete televisiva nazionale.</p><h2>Problemi ed avvenimenti recenti… il nucleare indiano</h2><p>Quale paese del mondo è pronto a spendere 175 miliardi di dollari per costruire nuove centrali nucleari, diventando un protagonista mondiale del “revival” dell’energia atomica? Se questa domanda viene posta ad un cittadino europeo o americano, è poco probabile che indovini la risposta giusta. E’ l’India la nazione a cui guardano oggi la General Electric, Westinghouse e gli altri colossi occidentali che fabbricano reattori nucleari. Mentre il resto del mondo aveva gli occhi puntati sulle crisi bancarie o sulle elezioni americane l’India è stata al centro di una svolta storica. Ha spezzato 34 anni di isolamento e sanzioni, un vero e proprio “apartheid nucleare” che le impediva di acquistare tecnologia atomica nel resto del mondo. L’embargo scattò quando New Delhi decise di dotarsi dell’arma nucleare.</p><p>Nel 1974 e nel 1998 (ne parlo nel paragrafo successivo) fece dei test condannati dalla comunità internazionale.</p><p>Rifiutò di aderire al trattato sulla non-proliferazione delle armi atomiche. Lo rifiuta tuttora, e sostanzialmente la sua posizione non è cambiata dai tempi in cui Indira Gandhi varò il programma dell’atomica (1974). Da allora si sono succeduti governi di diverso colore, maggioranze con dentro i comunisti oppure i nazionalisti indù, ma sulla Bomba la linea è la stessa. L’India si convinse di averne bisogno quando fu sconfitta dalla Cina nel 1962 e le colonne dell’Esercito Popolare di Liberazione, comandato da Mao, arrivarono a poca distanza da New Delhi. L’attaccamento all’arsenale nucleare si rafforzò per l’appoggio dell’America al Pakistan, con cui l’India ha combattuto diverse guerre. Per queste ragioni strategiche gli Indiani per un terzo di secolo hanno sfidato l’ira delle altre potenze, hanno incassato tutte le sanzioni. Ora di colpo cosa è cambiato? Non il comportamento dell’India, ma il “valore” dell’India.</p><p>Di fronte all’ascesa della potenza cinese – non solo sul piano economico ma anche militare – gli Stati Uniti si sono convinti ad accantonare ogni principio pur di corteggiare l’India.</p><p>La speranza degli americani è di poter coinvolgere l’India in un ruolo amico, per contenere l’espansione dell’influenza cinese nel mondo. L’India non ha mai detto che ci sta a giocare questo ruolo. Ma per ingraziarsela gli americani le hanno fatto un regalo eccezionale.</p><p>Poco prima dell’uscita di scena di George Bush, la sua Amministrazione ha tolto l’embargo sulle forniture di tecnologia nucleare civile all’India. La stessa cosa faranno le altre 45 nazioni che avevano aderito alle sanzioni contro New Delhi, comprese la Francia e la Russia che sono anch’esse interessate a entrare nel business della vendita di reattori nucleari.</p><p>E così di colpo l’India diventa il mercato più desiderato da tutta l’industria atomica mondiale.</p><p>New Delhi non ha concesso praticamente nulla in cambio: solo un simbolico diritto d’ispezione nelle 14 centrali nucleari già esistenti; ma restano top secret gli otto impianti militari. Il via libera alla costruzione di molte centrali atomiche aggiuntive, insieme con il sacro rispetto per la Bomba, è uno degli aspetti dell’India contemporanea che stupiscono gli occidentali. Si concilia male con l’idea che abbiamo di un paese impregnato di pacifismo e nonviolenza.</p><h2>Terrorismo islamico ed attriti con il vicino Pakistan</h2><p>L’India è il paese degli Indù (circa 900 milioni) ma al suo interno vivono circa 200 milioni di musulmani… l’India praticamente esperimenta ogni giorno la convivenza difficile tra due religioni all’interno del medesimo Stato… di attentati di matrice islamica ce ne sono stati diversi in India ed anche piuttosto cruenti con centinaia di morti (nel 1993, nel 1999, nel 2003, nel 2005, nel 2008)… sembra anche che Osama Bin Laden abbia fatto le “prove generali” del dirottamento di aerei, che poi avrebbe utilizzato sui cieli di Manhattan, proprio qui in India, dirottando nel 1999 un aereo delle Indian Airlines.</p><p>Come abbiamo già accennato, con l’indipendenza l’India si è anche divisa tra musulmani ed indù… tra scontri ed uccisioni i musulmani si sono spostati nella zona ad ovest di Bombay, dando vita allo Stato musulmano del Pakistan… naturalmente non tutti i musulmani se ne sono andati e 200 milioni di persone sono rimaste a vivere in India, tra continue tensioni.</p><p>Dopo la nascita dei due stati i conflitti sono continuati soprattutto nel Kashmir, regione a cavallo tra India e Pakistan, il cui confine non è stato ben definito. Quest’antica terra, famosa per la sua lana, è abitata in prevalenza da musulmani che vorrebbero staccarsi dall’India. Le continue tensioni con New Delhi, appoggiate naturalmente dal Pakistan, sfociano periodicamente in scontri sanguinosi.</p><p>Anche in India sono nati dei movimenti di integralisti, integralisti indù, che si oppongono ai musulmani. Quando i partiti politici vicini agli integralisti indù vinsero le elezioni nel 1998, una delle prime iniziative del nuovo governo è stata la ripresa degli esperimenti nucleari nel deserto di Thar (vedi il paragrafo precedente). Il loro scopo era dimostrare al vicino Pakistan le capacità offensive del Paese. Come risposta, anche il Pakistan ha effettuato i suoi esperimenti nucleari, e nel kashmir, già teatro di innumerevoli attentati da parte dei separatisti musulmani, la tensione tra i due eserciti si è fatta più intensa. Il culmine è stato raggiunto con l’attentato del 2002 contro il Parlamento di New Delhi, dopo il quale l’India e il Pakistan hanno ammassato truppe sulle frontiere. Fortunatamente alle elezioni del 2004 gli integralisti indù hanno perso le elezioni ed è salito al potere un governo molto più equilibrato, guidato da un famoso scienziato ed economista, uomo di cultura. Sono state aumentate le spese per l’istruzione e per l’assistenza alla gente povera, inoltre con il vicino Pakistan si è firmata una moratoria sulle armi nucleari, cercando di giungere ad accordi sulle frontiere del kashmir.</p><p>[…] “Il Kashmir vive nuovamente una situazione di estrema tensione a partire dal 5 agosto 2019, quando il governo indiano ha abolito lo status speciale della parte indiana della regione, per ragioni di sicurezza.</p><p>A seguito della rimozione dell’autonomia, dopo giorni di coprifuoco e blocco di internet e delle comunicazioni, il Kashmir è stato colpito da un’ondata di proteste. Alcune di queste sono state caratterizzate dal lancio di pietre contro i militari. Il gruppo per la tutela dei diritti umani, Amnesty International, ha affermato che la situazione in Kashmir è “senza precedenti” nella recente storia della regione. Secondo l’organizzazione le detenzioni e la repressione del dissenso hanno contribuito a “diffondere paura e terrore” nella regione.</p><p>L’esercito indiano e pakistano si stanno scontrando in combattimenti transfrontalieri nella contesa regione del Kashmir, mentre i due Paesi sono impegnati a fermare la diffusione dei focolai di coronavirus.</p><p>L’esercito pakistano ha dichiarato, il 9 aprile, di aver abbattuto un piccolo drone di sorveglianza indiano nella regione del Kashmir amministrata dal Pakistan.</p><p>I dati forniti dall’esercito indiano mostrano 411 violazioni del cessate il fuoco da parte dell’esercito pakistano a marzo 2020, il numero più alto in un solo mese, dal 2018.</p><p>In confronto, lo stesso mese del 2019 aveva visto 267 violazioni. Secondo una dichiarazione dell’esercito di Islamabad, il velivolo indiano abbattuto aveva percorso 600 metri oltre il confine, di fatto noto come Line of Control (LoC), un informale confine che separa i territori del Kashmir.</p><p>E gli scontri continuano, come avviene ormai da decenni […] (https://sicurezzainternazionale.luiss.it/2020/04/09/kashmir-scontri-trans-frontalieri-india-pakistan/).</p><p>Moratoria: termine che in linguaggio politico significa “trattato di sospensione”.</p><p>Integralisti (sia islamici che induisti): persone che vogliono applicare in politica le proprie idee religiose in modo molto rigido, senza essere capaci di tener presenti anche gli ideali degli altri… non scendono a compromessi e cercano di imporre la propria volontà con la forza (spesso con le armi).</p>";

const N=Q.length,S={cur:0,seen:new Set([0]),ans:{},flag:new Set(),filter:'all',z:1,left:3600,tm:null,done:false,status:'idle',printed:false,rc:false,savedAt:0,t0:0};

 else $('le').textContent='Utente o password non corretti.'}

function teacher(mode){const o=modal('<h3>Area docente</h3><p>Inserisci la password del docente.</p><input id="tp2" type="password"><div class="err" id="te"></div><div class="row"><button class="btn s" onclick="closeM()">Annulla</button><button class="btn" onclick="chk(\''+mode+'\')">Conferma</button></div>');

function isAns(i){const q=Q[i],a=S.ans[i];if(a===undefined||a===null)return false;if(q.t==='short')return a.trim().length>0;if(q.t==='drag')return a.every(x=>x);return true}
function counts(){let r=0;for(let i=0;i<N;i++)if(isAns(i))r++;return{seen:S.seen.size,r,u:N-r,f:S.flag.size}}

 let h='<div class="box"><h4>Stato della prova</h4><div class="stat"><span>👁 Visualizzato</span><span>'+c.seen+'/'+N+'</span></div><div class="stat"><span>◉ Risposto</span><span>'+c.r+'/'+N+'</span></div><div class="stat"><span>○ Senza risposta</span><span>'+c.u+'/'+N+'</span></div><div class="stat"><span>⚑ Contrassegnato</span><span>'+c.f+'/'+N+'</span></div></div>';
 h+='<div class="fil"><button class="'+(fl==='all'?'on':'')+'" onclick="S.filter=\'all\';renderSide()">Tutto</button><button class="'+(fl==='un'?'on':'')+'" onclick="S.filter=\'un\';renderSide()">○</button><button class="'+(fl==='fl'?'on':'')+'" onclick="S.filter=\'fl\';renderSide()">⚑</button></div><div class="sec" style="margin-top:12px">ITALIANO</div>';

 else if(q.t==='drag'){const a=S.ans[i]||q.c.map(()=>'');let k=0;

  h+='<div class="qt">'+q.p+'</div><p>'+txt+'</p><div class="bank">'+q.w.filter(w=>!a.includes(w)).map(w=>'<span class="chip" draggable="true" ondragstart="event.dataTransfer.setData(\'text\',this.textContent)" onclick="pickW(this.textContent)">'+w+'</span>').join('')+'</div>'}
 $('qp').innerHTML=h;$('qp').scrollTop=0}

function esito(i){const q=Q[i],a=S.ans[i];if(!isAns(i))return['—','Senza risposta',0];
