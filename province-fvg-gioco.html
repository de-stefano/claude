<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le province del Friuli Venezia Giulia</title>
<style>
:root{--ink:#123b4a;--sea:#e6f2f5;--sun:#f2a900;--ok:#2e9e5b;--ko:#d64545;--line:#b9d3da}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--sea)}
#app{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:clamp(1.4rem,4vw,2.1rem);margin:.2em 0 .1em}
.sub{margin:0 0 14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px}
label{display:flex;flex-direction:column;font-weight:700;font-size:.9rem;gap:4px}
input{font:inherit;padding:9px 12px;border:2px solid var(--line);border-radius:10px;min-width:170px}
input:focus,button:focus-visible{outline:3px solid var(--sun);outline-offset:1px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--ink);color:#fff}
button.alt{background:var(--sun);color:var(--ink)}
button:disabled{opacity:.4;cursor:not-allowed}
.play{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
.panel{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;text-align:center}
#ask{font-size:clamp(1.2rem,3.5vw,1.8rem);font-weight:800;min-height:1.6em}
#ask b{color:#b36b00}
#fb{min-height:1.5em;font-weight:700}
#fb.ok{color:var(--ok)}#fb.ko{color:var(--ko)}
#score{font-weight:700}
.mapbox{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;justify-content:center}
canvas{max-width:100%;height:auto;max-height:70vh;cursor:pointer}
#report{display:none}
@media print{
 body{background:#fff}#app{display:none}
 #report{display:block;font-family:Arial,sans-serif;color:#000;padding:10mm}
 #report h1{font-size:20pt}
 #report table{width:100%;border-collapse:collapse;margin:10px 0}
 #report th,#report td{border:1px solid #000;padding:6px 8px;text-align:left}
 #report .e{font-weight:700}
}
</style>
</head>
<body>
<div id="app">
 <h1>Trova la provincia</h1>
 <p class="sub">Friuli Venezia Giulia: clicca sulla provincia che ti viene chiesta.</p>
 <div class="bar">
  <label>Nome<input id="nome" autocomplete="off"></label>
  <label>Cognome<input id="cognome" autocomplete="off"></label>
  <button id="start">Inizia il gioco</button>
  <button id="again" class="alt" style="display:none">Gioca di nuovo</button>
  <button id="print" disabled>Stampa il report</button>
 </div>
 <div class="play">
  <div class="panel"><div id="ask">Scrivi nome e cognome, poi premi «Inizia il gioco».</div><div id="fb"></div><div id="score"></div></div>
  <div class="mapbox"><canvas id="cv"></canvas></div>
 </div>
</div>
<div id="report"></div>

function next(){
 $("fb").textContent="";$("fb").className="";
 $("ask").innerHTML="Clicca sulla provincia di <b>"+NAMES[order[cur]]+"</b>";
 $("score").textContent="Domanda "+(cur+1)+" di 4 · Punti: "+points();
}
const points=()=>results.filter(r=>r.ok).length;
cv.addEventListener("click",async e=>{
 if(state!=="play"||locked)return;
 const r=cv.getBoundingClientRect();
 const x=Math.floor((e.clientX-r.left)*W/r.width),y=Math.floor((e.clientY-r.top)*H/r.height);
 const l=labels[y*W+x];if(!l)return;
 locked=true;
 const target=order[cur],ok=l===target;
 results.push({target:NAMES[target],given:NAMES[l],ok});
 marks[target]=ok?[46,158,91]:[214,69,69];draw();
 $("fb").className=ok?"ok":"ko";
 $("fb").textContent=ok?"Giusto! +1 punto":"Non è questa. Hai cliccato "+NAMES[l]+". La provincia colorata in rosso è "+NAMES[target]+".";
 $("score").textContent="Punti: "+points();
 await pause(ok?900:2200);
 cur++;locked=false;
 if(cur<4)next();else finish();
});
function finish(){
 state="done";
 $("ask").textContent="Gioco finito, "+player.nome+"!";
 $("fb").className="";$("fb").textContent="";
 $("score").textContent="Hai totalizzato "+points()+" punti su 4. Ora puoi stampare il report.";
 $("print").disabled=false;
}
function buildReport(){
 const dt=startTime.toLocaleString("it-IT",{dateStyle:"full",timeStyle:"short"});
 const rows=results.map((r,i)=>"<tr><td>"+(i+1)+"</td><td>"+r.target+"</td><td>"+r.given+"</td><td class='e'>"+(r.ok?"Corretta (1 pt)":"Errata (0 pt)")+"</td></tr>").join("");
 const good=results.filter(r=>r.ok).map(r=>r.target),bad=results.filter(r=>!r.ok);
 $("report").innerHTML="<h1>Report – Le province del Friuli Venezia Giulia</h1>"+
  "<p><b>Alunno:</b> "+esc(player.nome)+" "+esc(player.cognome)+"<br><b>Data e ora:</b> "+dt+"<br><b>Punteggio:</b> "+points()+" su 4</p>"+
  "<table><tr><th>N.</th><th>Provincia estratta</th><th>Risposta dell'alunno</th><th>Esito</th></tr>"+rows+"</table>"+
  "<p><b>Risposte corrette:</b> "+(good.length?good.join(", "):"nessuna")+"</p>"+
  "<p><b>Errori commessi:</b> "+(bad.length?bad.map(r=>"cercava "+r.target+", ha cliccato "+r.given).join("; "):"nessuno")+"</p>";
}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
$("start").onclick=begin;$("again").onclick=begin;
$("print").onclick=()=>{if(state!=="done")return;buildReport();window.print();};
load();
</script>
</body>
</html>
