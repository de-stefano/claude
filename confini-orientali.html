<script>
const B="https://de-stefano.github.io/claude/";
const K=["Le cause della I Guerra mondiale furono molteplici, ma nessuna da sola sarebbe stata sufficiente per far esplodere il conflitto; tutti gli storici sono d’accordo nel dire che la causa principale non è possibile da trovare ed anche mettendo assieme tutte queste cause resta difficile dire perché scoppiò una guerra così cruenta che si poteva evitare.\n\nSintetizzando si può dire che le cause della prima guerra mondiale furono almeno nove: 1) Rivalità storica tra Italia ed Austria-Ungheria;\n\n2) Rivalità navale tra Germania ed Inghilterra;\n\n3) Corsa agli armamenti da parte delle più grandi Nazioni d’Europa;\n\n4) Annessione della Bosnia da parte dell’Austria-Ungheria;\n\n5) Crisi marocchina (per motivi coloniali) tra Francia e Germania;\n\n6) Conquista della Libia da parte dell’Italia, che mise in risalto la debolezza della Turchia. 7) Guerre balcaniche, che accentuarono la crisi tra Austria_Ungheria e Serbia/Russia 8) Scontro tra Tedeschi e Russi perché la Germania aiutò la Turchia durante le guerre dei Balcani.\n\n9) Corsa generalizzata al colonialismo per motivi economici.\n\nCRISI TRA … CAUSA Annessione della Bosnia-Erzegovina Austria e Guerre Balcaniche Austria e Rivalità storica tra Austria ed Italia Conquista della Libia da parte dell’Italia Crisi marocchina Austria e Italia e Germania e … Germania e Germania e Ampliamento della flotta tedesca Appoggio della Germania a Turchia nei Balcani Aumento degli armamenti di tutte le Nazioni Corsa alla colonizzazione per motivi economici Serbia Russia Serbia Russia Italia Turchia Francia Inghilterra Russia  Triplice Intesa Generalizzato tra Triplice ed Intesa Generalizzato tra Triplice ed Intesa La rivalità storica tra Italia ed Austria-Ungheria risaliva all’Ottocento, durante le tre Guerre di Indipendenza per riscattare le terre del Trentino Alto Adige, di Trieste e Gorizia. L’annessione della Bosnia Erzegovina da parte dell’Austria nel 1908 fece infuriare sia la Russia che la Serbia; la Serbia voleva unificare tutti i Paesi slavi sotto di sé (come aveva fatto il Piemonte, raggiungendo l’unità d’Italia, e la Prussia, raggiungendo l’unità della Germania); la Russia voleva ottenere uno sbocco sul mare attraverso gli stretti del Bosforo e dei Dardanelli,o attraverso il Montenegro: l’indebolimento della Serbia, comunque, non le andava bene.\n\nLa conquista della Libia da parte dell’Italia nel 1912 mise in rilievo la debolezza della Turchia, che in teoria possedeva la Libia, ma che non era riuscita a difenderla; il vecchio Impero Ottomano non era più forte come un tempo; questa sconfitta fece capire a tutti come i possedimenti europei della Turchia non erano più difendibili e quindi facilmente attaccabili.\n\nLe guerre balcaniche furono mosse contro la Turchia dopo che si scoprì la sua debolezza; la Serbia, assieme al Montenegro, la Grecia e la Bulgaria mossero guerra alla Turchia per l’indipendenza; durante questa guerra riuscirono a sconfiggere gli Ottomani e a prendere il sopravvento sui Balcani; dopo questa prima guerra la Bulgaria, pensando di essere piuttosto forte, mosse guerra ai suoi ex alleati, ma fu sconfitta; alla fine della seconda guerra balcanica la Serbia era divenuta molto potente, quindi Austria e Serbia in questa zona si confrontavano per la supremazia!\n\nDurante la crisi nei Balcani la Germania aveva appoggiato ed aiutato la Turchia e questo aveva indispettito la Russia, che era la protettrice della Serbia, anche per ovvi motivi di tornaconto personale.\n\nDurante l’Ottocento tutte le grandi Nazioni avevano ampliato i propri armamenti e si erano gettate alla rincorsa di un impero coloniale; questi due aspetti sono intrecciati tra di loro in quanto le grandi industrie erano favorevoli sia al proliferare degli armamenti, in quanto così ottenevano commesse statali per la produzione di armi, sia perché le spedizioni coloniali ampliavano il mercato, oltre che procurare nuove materie prime. Nell’ottica dell’ampliamento dei propri armamenti e della ricerca di ampliare il proprio impero coloniale, la Germania sia era data alla creazione di una grande flotta marinara che potesse competere con l’Inghilterra, da sempre dominatrice dei mari; questo fu motivo di grande attrito tra i due paesi.\n\nL’ultimo motivo di scontro tra Paesi europei si collega allo spirito di revanscismo della Francia nei confronti della Germania, dopo la sconfitta di Sedan (1870); a questo attrito si aggiunse quello collegato alle due crisi marocchine.\n\nNel 1906 la Germania appoggiò il Marocco nel suo tentativo di indipendenza, ma in una conferenza tenutasi ad Algesiras si ribadì i preminenti interessi della Francia sul Marocco; in seguito, nel 1911, in Marocco scoppiarono dei tumulti contro gli stranieri e la Francia intervenne, pensando di sottomettere definitivamente il Marocco sotto di sé; intervenne a questo punto la Germania che inviò un suo incrociatore al largo delle coste marocchine, ad Agadir; sia la Francia che l’Inghilterra intervennero e la Germania dovette riconoscere il dato di fatto, ma la rivalità tra Francia e Germania peggiorò ed aumentò notevolmente.", "Domande Risposte Quali erano i due schieramenti Triplice Alleanza:\n\nall’inizio della I Guerra?\n\nGermania, Austria, Italia Triplice Intesa:\n\nFrancia, Gran Bretagna, Russia Cause:\n\nPOLITICHE:\n\nLa Francia voleva l’Alsazia e la Lorena occupate dalla Germania;\n\nL’Italia voleva Trento e Trieste che erano sotto il dominio dell’Impero Austro-ungarico;\n\nRussia, Austria e Italia volevano i Balcani;\n\nMILITARI:\n\ncorsa agli armamenti ECONOMICHE:\n\nControllare le materie prime (Africa e Asia);\n\nLe industrie, se c’è una guerra, guadagnano producendo armi quindi spingevano i politici a dichiarare guerra.\n\nIn che anno inizia la guerra?\n\nNel 1914 In che anno finisce la guerra?\n\nNel 1918 In che anno inizia la guerra Nel 1915, 24 maggio per l’Italia?\n\nQual era la clausola, presente Se uno Stato dell’Alleanza veniva attaccato, gli altri nel trattato della Triplice dovevano difenderlo militarmente.\n\nAlleanza, che ci ha permesso di restare neutrali?\n\nQuando fu firmato il Patto di Nel 1915, 26 aprile Londra?\n\nDomande Risposte Cosa prevedeva il Patto di Prevedeva che se l’Italia entrava in guerra a fianco Londra? Cosa veniva dell’Inghilterra e della Francia avrebbe avuto Trento, promesso all’Italia?\n\nTrieste, la Dalmazia e l’Istria, (senza la città di Fiume) Quando vi fu l’Attentato di Nel 1914, 28 giugno.\n\nSarajevo? Chi lo fece? Contro Lo fece Gavrilo Princip un nazionalista serbo, chi?\n\ncontro Francesco Ferdinando, erede al trono d’Austria perché l’Impero Austro-ungarico aveva occupato la Bosnia.\n\nCosa prevedeva l’ultimatum Cosa doveva fare la Serbia?\n\nche l’Austria-Ungheria inviò La Serbia doveva:\n\nalla Serbia?\n\n1) rinunciare a ogni tendenza separatista esistente tra gli Quale richiesta era veramente Slavi;\n\n“difficile da accettare” da parte 2) impegnarsi a combattere tutte le forze anti-Austriache della Serbia?\n\npresenti in Serbia (chiudere giornali, riviste, partiti, gruppi anti-Austriaci).\n\nIl fatto che le indagini sull’attentato fossero condotte da funzionari e polizia austriaca però era veramente INACCETTABILE.\n\nTutto questo doveva essere fatto ENTRO 1 mese altrimenti l’Austria-Ungheria avrebbe fatto guerra alla Serbia…. e così fu.\n\nDove si trovavano i tre Fronte occidentale: in Francia dove combatterono principali fronti durante la principalmente Tedeschi contro Francesi e Inglesi.\n\nprima guerra mondiale?\n\nFronte meridionale: in Italia, dal Passo dello Stelvio fino al fiume Isonzo in Friuli Venezia-Giulia; qui combatterono principalmente Italiani contro Austroungarici. Fronte orientale: tra Russia e Germania Nella nostra Regione dove si Il fronte si trovava sul fiume Isonzo… le principali trovava il fronte? (Su quale battaglie si combatterono nei dintorni di Gorizia e poi fiume) nella zona di Caporetto Domande Risposte Quante battaglie si Su questo fronte si combatterono ben 12 battaglie combatterono su questo fronte?\n\nDove fu combattuta la La dodicesima battaglia fu combattuta a Caporetto e fu dodicesima battaglia? Quali per noi Italiani una sconfitta terribile… oltre a migliaia di conseguenze terribili ci furono morti (gli Austriaci utilizzarono i gas) perdemmo anche per l’Italia?\n\ntantissimo materiale bellico lasciato sul posto durante la fuga (cavalli, muli, cannoni, casse di bombe e munizioni, fucili, mitragliatrici).\n\nPerdemmo inoltre più di 150 Km di terreno… tutto il Friuli Venezia-Giulia fu occupato dagli Austriaci e anche buona parte del Veneto… noi Italiani fuggimmo fino al fiume Piave, dove fu posizionato il nuovo fronte (una sconfitta così non ci fu in nessun altro posto durante la I Guerra Mondiale) Dove fu spostato il fronte dopo Il fronte fu spostato sul fiume Piave questa battaglia?\n\nNel 1917 accaddero tre cose 1) La Russia esce dalla guerra firmando la pace a Brest importanti (non entrare nel Litovosk;\n\ndettaglio… solo le tre cose importanti 2) Gli USA entrano in guerra a fianco di Francia, che si verificarono… una l’hai già Inghilterra e Italia (assieme quindi alla triplice Intesa) detta nella domanda precedente) 3) Sconfitta di Caporetto per noi Italiani Con quale battaglia l’Italia Per l’Italia la guerra finì il 4 novembre 1918 con la mise fine alla prima guerra battaglia di Vittorio Veneto (città in Veneto) mondiale?", "La pace firmata a Versailles nel 1919-1920 mise fine alla Prima Guerra Mondiale.\n\nQuesta pace è stata definita una “pace punitiva” nei confronti degli sconfitti, cioè della Germania e dell'Austria-Ungheria.\n\nGermania Aspetti territoriali  Dovette restituire alla Francia l’Alsazia e la Lorena (che erano le regioni che aveva conquistato già nel lontano 1870 con la guerra Franco-Prussiana.\n\n Dovette rinunciare a tutte le colonie.\n\n Dovette rinunciare alla città di Danzica (formata da cittadini tedeschi) ed accettare in questo modo che il territorio tedesco fosse “spezzato” in due, infatti tra la Germania e la Prussia adesso vi era territorio polacco (chiamato “corridoio polacco”).\n\nAspetti economici  Dovette pagare dei “danni di guerra” pari a 132 miliardi di marchi-oro.\n\n Dovette concedere alla Francia l’usufrutto della zona mineraria (carbone) della Saar.\n\nAspetti militari Dovette smilitarizzare la zona della Renania.\n\nDovette ridurre l’esercito a soli 100.000 uomini.\n\nDovette ridurre la marina a sole 36 navi.\n\nAspetti politici Dovette riconoscere ufficialmente di essere stata la causa della Prima Guerra Mondiale e dei danni avvenuti ai Paesi dell’Intesa a causa della Guerra.\n\nAustria-Ungheria Aspetti territoriali Dovette rinunciare a tutta l’Ungheria che fu separata dal resto dell’Impero.\n\nDovette concedere territori all’Italia (Trento, Alto-Adige, Gorizia, Trieste e l’Istria.\n\nDovette concedere territori alla Cecoslovacchia (che si forma come Stato autonomo) e alla Iugoslavia (che si forma come Stato autonomo).\n\nQuestione Italiana L’Italia partecipò alla conferenza di pace con i suoi rappresentanti diplomatici che avevano idee e visioni diverse.\n\nL’Italia, comunque, non aveva idee chiare.\n\nDesiderava ottenere il massimo possibile: Trento e l’Alto-Adige, Trieste, Gorizia, l’Istria e la Dalmazia. Questo era quello che era stato deciso con il Patto di Londra.\n\nIn realtà la Dalmazia fu data al nuovo Stato della Jugoslavia.\n\nGli Italiani, già delusi per non aver ottenuto la Dalmazia, volevano la città di Fiume, che non era prevista dal Patto di Londra.\n\nA questo punto gli Italiani si affidano ai Quattordici Punti di Wilson, che aveva parlato della “autodeterminazione dei popoli a decidere a quale Stato appartenere”. La città di Fiume, infatti, si era proclamata con un referendum di nazionalità italiana.\n\nMa le due cose erano contraddittorie.\n\nSe si voleva applicare il Patto di Londra si accettava l’idea di annettersi (prendersi) anche territori dove abitavano popolazioni non italiane (vedi l’Istria e l’Alto-Adige); se si chiedeva Fiume rifacendosi ai Quattordici Punti di Wilson ci si rifaceva al concetto di Nazionalità italiana, ma allora si avrebbe dovuto rinunciare ad altre zone non italiane (l’Istria e l’AltoAdige, appunto).", "Confini Orientali Lezione 1 1919- questione di Fiume PAROLE E CONCETTI CHIAVE: Patto di Londra e Quattordici punti di Wilson- diplomazia italiana divisa- partenza da Ronchi dei Legionari- occupazione di Fiume- referendum a favore dell’annessione all’Italia- occupazione di Zara- Trattato di Rapallo- liberazione di Fiume… D’Annunzio esce da Fiume coni Legionari in camicia nera Cronologia essenziale Gennaio 1919:\n\nInizia la Conferenza di Pace di Versailles 12 Settembre 1919 Partenza della spedizione di Fiume Ottobre 1919 Referendum a Fiume (vince la tesi della annessione all’Italia) Novembre 1919 D’Annunzio conquista Zara 1920 Nuove elezioni in Italia: Giolitti succede a Nitti Novembre 1920 Trattato di Rapallo (Dalmazia alla Jugoslavia, Zara all’Italia, Fiume a nessuno) Dicembre 1920 Il Natale di sangue… tutti a casa… in camicia nera Trattato di pace a Versailles L’Italia partecipò alla conferenza di pace di Versailles (gennaio 1919- gennaio 1920) con i suoi rappresentanti diplomatici che avevano idee e visioni diverse: il ministro degli Esteri, Sydney Sonnino, desiderava l’integrale applicazione del Patto di Londra, il presidente del Consiglio, Vittorio Emanuele Orlando, era invece più propenso all’impostazione data dai “Quattordici punti di Wilson”... questa divisione tra i nostri rappresentanti politici portò l’Italia ad una situazione di stallo e creò le premesse per la nascita della eversiva “spedizione di Fiume”, capitanata dal poeta ed avventuriero Gabriele D’Annunzio. Trento e l’Alto-Adige, Trieste e Gorizia, l’Istria e la Dalmazia… questo era ciò che era stato promesso all’Italia con il Patto di Londra, al suo ingresso in guerra, ma ben cinque lunghi anni erano passati da allora; questo, comunque, era anche quello che pervicacemente ed ostinatamente continuava a chiedere il nostro ministro degli Esteri, Sonnino.\n\nLe diplomazie degli Stati vincitori erano però contrarie.\n\nFu il nostro presidente del Consiglio, Vittorio Emanuele Orlando, a chiedere allora per Fiume l’applicazione dei Quattordici Punti di Wilson, visto che era abitata da una maggioranza di cittadini italiani ed era un porto assai importante nell’Alto Adriatico. Spedizione di Fiume Mentre a Versailles si discuteva, il poeta Gabriele D’Annunzio reclutò nei pressi di Venezia un contingente di circa mille ex ufficiali, che avevano dato vita ad un gruppo politico denominato “O Fiume o morte!”.\n\nDa lì si spostò in Friuli Venezia Giulia, a Ronchi, da dove la spedizione partì il 12 settembre del 1919. I suoi soldati furono nominati “Legionari” (con il solito vezzo del mito di Roma antica) e la cittadina friulana da allora prese il nome di Ronchi dei Legionari (nome imposto in epoca fascista e tuttora in vigore).\n\nL’ingresso a Fiume avvenne senza sparare un colpo perché l’esercito regolare italiano, schierato davanti alla cittadina, lasciò passare D’Annunzio e i suoi.\n\nL’allora Presidente del Consiglio, Nitti, non approvò la missione, utilizzò anche parole sferzanti contro il “Poeta”, ma di fatto non fece intervenire l’esercito.\n\nI Paesi vincitori della I Guerra Mondiale, intanto, continuavano le trattative di Pace a Versailles, disapprovando la missione, ma sperando che la faccenda venisse risolta diplomaticamente dalle autorità politiche italiane (che non avrebbero dovuto tollerare il colpo di mano di un avventuriero irregolare che non rispettava la volontà del Parlamento e gli ordini del Presidente del Consiglio).\n\nChe cosa pensasse in verità D’Annunzio di Nitti è facile a dirsi, visto che inventò per lui un appellativo emblematico, “Cagoja”.\n\nLa città di Fiume, intanto, pur essendo in mano a D’Annunzio, venne circondata dalle truppe italiane regolari… il Poeta allora dichiarò lo Stato d’assedio e si disse pronto ad applicare le leggi militari e la pena di morte contro chiunque si fosse opposto alla “causa fiumana”.\n\nReferendum e conquista di Zara Il 26 ottobre 1919 si indisse un referendum, cui parteciparono 7155 cittadini fiumani; ben 6999 si dichiararono favorevoli all’annessione all’Italia. D’Annunzio a questo punto, rinvigorito dal successo ottenuto, scrisse a Mussolini (suo interlocutore politico sin dagli inizi) e gli prospettò l’idea di un’altra marcia da effettuare… una marcia su Roma! Mussolini gli rispose cercando di frenare i suoi ardori… secondo il futuro Duce sarebbe stata un’operazione avventata e destinata all’insuccesso… ma probabilmente si palesava già, e non per la prima volta, l’invidia che Mussolini avrebbe sempre nutrito per la fama di D’Annunzio, il quale al tempo si era conquistato maggiore popolarità di Benito Mussolini stesso, ancora agli albori della sua carriera politica.\n\nLe potenze europee intanto ammonirono l’Italia affinché ponesse fine a quell’avventura che era, in tutti i sensi, un atto eversivo!\n\nIl Presidente del Consiglio, però prese tempo… c’erano le elezioni politiche e non voleva perdere consensi tra l’elettorato.\n\nD’Annunzio ne approfittò e si inventò un’altra spedizione… questa volta verso la città di Zara, che venne conquistata il 19 novembre 1919.\n\nTrattato di Rapallo Svolte le elezioni vi fu un cambio di Governo in Italia e il nuovo Presidente del Consiglio, Giolitti, dichierò subito le proprie intenzioni: D’Annunzio doveva sgombrare Fiume!\n\nSiamo ormai al 12 di novembre del 1920… Con il Trattato di Rapallo Giolitti e i rappresentanti degli Stati vincitori assumono le seguenti decisioni:\n\n❑ Dalmazia allo Stato della Jugoslavia;\n\n❑ Zara (occupata da D’Annunzio) all’Italia;\n\n❑ Fiume città libera ed indipendente.\n\nA dicembre il generale Caviglia viene inviato a Fiume per liberare la città.\n\nD’Annunzio dichiara che sarà un Natale di sangue ma, ai primi colpi di cannone che piovono sul palazzo della sede del Governo fiumano, si arrende e alla testa dei suoi Legionari, tutti vestiti di camicia nera, abbandona la città.", "Confini Orientali Lezione 6 LIBERAZIONE DI TRIESTE E CONFINI ORIENTALI: ESODO ISTRIANO 1945-1954 L’Istria e la città di Trieste vennero liberate dall’occupazione nazista grazie all’intervento militare della IV Armata e della Resistenza partigiana jugoslava, che entrarono nel capoluogo giuliano il 1 maggio del 1945; Pola, altro centro assai importante del sud dell’Istria, fu liberata il 6 maggio, Zagabria l’8, Lubiana l’11.\n\nLe truppe Anglo-Americane arrivarono a Trieste il 2 maggio, con un giorno di ritardo rispetto agli Jugoslavi: avevano perso la “corsa per Trieste”. Le vicende che interessarono questa zona della nostra Penisola, infatti, si intrecciarono da subito con problemi di relazioni internazionali che andavano ben oltre i rapporti tra Jugoslavia e Italia: da una parte c’era l’Urss e il mondo comunista, dall’altra l’Inghilterra, gli Stati Uniti e il mondo capitalista.\n\nIl lunghissimo scontro politico (spesso arrivato ad un passo dal diventare anche scontro militare) sui confini orientali fu per alcuni storici uno dei primi episodi della “Guerra fredda”, almeno a partire dal 1947.\n\nLe pretese jugoslave erano lontanissime da quelle italiane e questo naturalmente rese ancora più difficile il districarsi della matassa internazionale: gli Jugoslavi sin dal 1944 (addirittura sin dal 1919-conferenza di pace di Versailles) avevano posto come loro obiettivo quello di uno Stato jugoslavo che arrivasse in Slovenia sino al vecchio confine austro-ungarico, posto lungo il fiume Isonzo e la sponda sinistra del fiume Iudrio (alcuni Sloveni ultranazionalisti proponevano addirittura un confine sul fiume Tagliamento, comprendendo quindi anche la città di Udine), mentre dal canto loro gli Italiani ambivano a riportare i confini sino a comprendere tutta l’Istria, possibilmente con la città di Fiume annessa.\n\nL’Istria e la Venezia Giulia erano allora una zona etnicamente molto complessa, con la presenza di ampie minoranze italiane (37%), slovene (14%), croate (42%) e, in minor numero, tedesche e ungheresi. Trieste fu amministrata dai partigiani jugoslavi per 40 giorni, dopo la liberazione, fino al 9 giugno 1945.\n\nFurono questi i giorni durante i quali si verificarono le tragedie degli infoibamenti, degli arresti indiscriminati da parte dell’OZNA (polizia segreta), delle deportazioni in campi di concentramento e delle sparizioni di italiani. Come è ormai documentato ampiamente, oggetto di queste violenze non furono solamente persone in qualche modo compromesse con il passato regime fascista, ma anche sinceri antifascisti che però si opponevano ai disegni politici jugoslavi: instaurazione di un regime comunista e annessione della Venezia Giulia allo Stato Jugoslavo. Il concetto che stava dietro a queste epurazioni politiche era quello che, presentandosi alle trattative di pace con il controllo militare, politico e amministrativo della zona, sarebbe stato più facile ottenere da parte jugoslava soddisfazione alle proprie ambizioni e richieste territoriali; una situazione poi che avesse presentato anche una semplificazione etnica, cioè una diminuzione della popolazione italiana (“non slava”), avrebbe ulteriormente facilitato le cose.\n\nLe vicende storiche che si dipanarono a partire dal 1 maggio 1945 e si conclusero il 26 ottobre 1954 (applicazione del Memorandum di Londra) per la definizione dei confini, furono quindi anche teatro di un’altra tragedia: l’esodo di 300.000 Istriani, Fiumani e Dalmati che lasciarono forzatamente e per sempre le loro terre natie.\n\nL’Istria che, secondo un censimento austro-ungarico, nel 1910 contava 359.104 Italiani, nell’ultimo censimento jugoslavo disponibile, del 1991, riportava un totale di soli 22.190 residenti di nazionalità italiana.\n\nLe partenze dall’Istria svuotarono interi paesi e comuni, soprattutto nelle località costiere dove era maggiormente concentrata la popolazione di cultura italiana: 28 mila esuli su 32 mila abitanti a Pola, 8 mila esuli su 10.000 abitanti a Rovigno, il 90% della popolazione di Parenzo, quasi la totalità (99%) degli abitanti di paesi come Pinguente, Montona, Sissona.\n\nLa storia di quello che è stato definito un esodo trova radici, cause e spiegazioni in molteplici fattori, a volte anche diversi tra città e città, località e località, periodo e periodo, ma che alla fine si possono ricondurre ad alcuni fattori comuni principali: la paura per la propria incolumità fisica, l’instaurazione di una economia di tipo comunista con la nazionalizzazione delle grandi industrie e delle attività commerciali, ma anche delle piccole e medie imprese familiari e la jugoslavizzazione della società, con l’oppressione e la limitazione di ogni espressione culturale “non slava”. È da notare, inoltre, che l’esodo interessò tutte le classi sociali, anche il cosiddetto proletariato urbano, politicamente più vicino alle idee comuniste; ciò che fu percepito con sgomento dagli Istriani di nazionalità italiana, infatti, non fu tanto la volontà di imporre alcune istanze e ideologie politiche, che per altro erano sicuramente presenti nella Resistenza jugoslava, quanto la virulenza di un nazionalismo esasperato, desideroso di imporre la cultura croata e slovena su quella “italiana”. L’Italia d’altronde aveva perso una guerra, che aveva scatenato assieme al suo alleato nazista. Adesso, nonostante i tentativi della Diplomazia di far passare la nostra Nazione come uno Stato cobelligerante dei paesi vincitori, stava per giungere il momento in cui ci sarebbe stato chiesto di render ragione; il pericolo concreto era che a farne le spese sarebbero state le zone di frontiera contese, quasi un risarcimento dei danni di guerra, da rendere ai Paesi che avevamo invaso e oppresso in epoca fascista.\n\nL’esodo delle popolazioni Istriane, Fiumane e Dalmate si verificò in parte lungo l’intero decennio (1945-1955), ma conobbe dei momenti di maggiore intensità in concomitanza con ben precisi avvenimenti politici.\n\nDopo i 40 giorni di amministrazione jugoslava della città di Trieste le grandi potenze giunsero a un temporaneo accordo, siglato il 9 giugno 1945; suddivisione del territorio in due zone: zona A, amministrata direttamente dagli Anglo-Americani (Governo Militare Alleato-GMA), che andava grosso modo dal passo del Predil (quasi a confine con l’Austria) sino al comune di Muggia, nel golfo di Trieste e zona B, amministrata direttamente dal Comando dell’esercito jugoslavo (VUJA), che comprendeva tutta l’Istria, le isole del golfo del Quarnero e la Dalmazia; Pola, benché completamente staccata ed isolata in piena zona B, fu attribuita alla zona A, come enclave*. Nel frattempo una Commissione di esperti avrebbe dovuto studiare i confini per creare un Territorio Libero di Trieste, una specie di Stato cuscinetto* da interporre tra Italia e Jugoslavia. La Commissione in questione ispezionò ben 5 grandi città e 27 piccoli paesi, per stabilirne etnia e futura appartenenza, in 28 giorni di lavoro nella primavera del 1946; non fece neppure sosta a Fiume, la cui sorte evidentemente era già segnata, mentre correvano sempre più insistenti le voci che anche Pola sarebbe passata sotto amministrazione jugoslava: è proprio durante l’estate del 1946 che iniziano i primi esodi da queste due grandi città. Terminati i lavori della Commissione, dopo lunghi dibattiti si giunge alla proposta definitiva che viene portata alla firma della pace di Parigi (10 febbraio 1947-data scelta dall’Italia come giorno del Ricordo delle vittime delle Foibe e degli esuli GiulianoDalmati). Gran parte delle zone A e B passano “definitivamente” in mano ai rispettivi governi, italiano e jugoslavo, mentre si istituisce il territorio Libero di Trieste (TLT) che a sua volta viene suddiviso nuovamente in zona A (dal fiume Timavo al comune di Muggia, amministrata dal GMA) e zona B (da Muggia al fiume Quieto, amministrata dal VUJA).\n\nAncora una volta è un’ondata di esodi, questa volta “protetti” anche da accordi e clausole presenti nel trattato di pace (entro un anno era possibile optare per una nuova nazionalità e quindi passare, con alcune tutele giuridiche, ad abitare da uno Stato all’altro). Gli Istriani che erano stati definitivamente annessi allo Stato jugoslavo in massa optano per la nazionalità italiana e abbandonano le loro terre, lasciando beni immobili e depositi bancari, che non poterono portare con sé, per restrizioni appositamente istituite dal governo jugoslavo. Rimangono ancora aggrappati alle loro terre uno sparuto gruppo di famiglie, poche migliaia di persone: chi per età o condizioni economiche non è potuto partire precedentemente o chi, vivendo nella zona B del TLT, spera ancora nella annessione all’Italia. La situazione delineata con questa spartizione perdurerà sino al 1954, quando, con un ultimo accordo (Memorandum di Londra- 26 ottobre), la zona A passerà all’Italia e la zona B alla Jugoslavia: questo trattato darà il via all’ultima ondata di esuli che tra il 1954 e il 1955 abbandonerà l’Istria.\n\nIl trattato di Osimo del 1975 in seguito ratificherà, questa volta veramente in modo definitivo, ciò che nel 1954 era già stato deciso.\n\n*Enclave= piccolo territorio appartenente ad uno Stato, ma completamente circondato dal territorio di un altro Stato, tanto da risultarne staccato e non comunicante.\n\n*Stato cuscinetto= un piccolo Stato, che viene creato da accordi politici, e che ha la funzione di dividere due Stati in continuo contrasto tra di loro; lo Stato cuscinetto ha quindi il compito di separare i territori di due Stati in perenne inimicizia.", "CONFINI ORIENTALI: I TRATTATI (breve riassunto) 1915 - Il Patto di Londra, siglato il 26 aprile, impegnava l'Italia ad entrare in guerra entro un mese a fianco della Triplice Intesa; il Patto prevedeva, come risarcimento per l’impegno bellico italiano, la consegna a fine guerra di Trento e dell’Alto-Adige, di Trieste e di Gorizia, dell’Istria e della Dalmazia. Così il 24 maggio di quell’anno l'Italia entrava in guerra. 1919-1920 - Con il Trattato di Saint-Germain, e in seguito con il Trattato di Rapallo la Dalmazia viene assegnata al Regno dei Serbi, dei Croati e degli Sloveni (futura Jugoslavia), l'Istria e la città di Zara vengono assegnate all’Italia e Fiume viene dichiarata città libera ed indipendente (il 27 gennaio 1924 un accordo tra Italia e Jugoslavia sancì l'annessione di Fiume al Regno d'Italia).\n\n1947 - Il Trattato di pace tra la Repubblica italiana e le potenze vincitrici della seconda guerra mondiale, firmato a Parigi il 10 febbraio 1947, stabiliva la cessione - delle isole adriatiche di Cherso, Lussino, Lagosta e Pelagosa - dell'Istria a sud del fiume Quieto - della città di Fiume - del territorio che è attualmente la parte occidentale della Slovenia alla Jugoslavia… ampie zone di confine saranno suddivise in ZONA A (temporaneamente all’Italia) e ZONA B (temporaneamente alla Jugoslavia).-→ confronta quanto meglio specificato nella scheda “Liberazione di Trieste e confini orientali”.\n\nLa situazione delineata con questa spartizione perdurerà sino al 1954, quando, con un ultimo accordo (Memorandum di Londra- 26 ottobre), la zona A passerà all’Italia e la zona B alla Jugoslavia: questo trattato darà il via all’ultima ondata di esuli italiani che tra il 1954 e il 1955 abbandonerà l’Istria.\n\nIl trattato di Osimo del 1975 in seguito ratificherà, questa volta veramente in modo definitivo, ciò che nel 1954 era già stato deciso."];

 if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});S.step=11;render()}
function showRes(){const a=S.att[S.att.length-1];$("#res").innerHTML=`<p><b>Corrette: ${a.ok} / 40 - Sbagliate o mancanti: ${a.ko}</b> - Durata ${fmt(a.dur)}${a.reason?" - <span style='color:#c0392b'>"+a.reason+"</span>":""}</p>`+
 a.sc.map(s=>`<p><b>Scheda ${s.k}</b> (${s.map})<br><span class="${s.tok?"good":"bad"}">Titolo: ${s.tg}</span><br>${s.pk.map(x=>`<span class="${x.ok?"good":"bad"}">${x.tx}</span>`).join("<br>")}${s.pk.length<4?"<br><i>Frasi mancanti: "+(4-s.pk.length)+"</i>":""}</p>`).join("")}
function makePdf(){if(!S.att.length){alert("Prima controlla il risultato.");return}
 const d=new (window.jspdf.jsPDF)(),W=180;let y=15;const L=(t,b)=>{d.setFont("helvetica",b?"bold":"normal");d.splitTextToSize(String(t),W).forEach(r=>{if(y>280){d.addPage();y=15}d.text(r,15,y);y+=6})};
 L("REPORT ESERCIZIO - Confini orientali",1);L("Alunno: "+S.cogn+" "+S.nome+" - Classe: "+S.cl);L("Tentativi effettuati: "+S.att.length);
 S.att.forEach(a=>{y+=4;L("TENTATIVO "+a.n+" - Data "+a.date+" - Ora inizio "+a.time+" - Durata "+fmt(a.dur),1);L("Esito: "+a.ok+" corrette, "+a.ko+" sbagliate/mancanti su 40"+(a.reason?" - ATTIVITA' INTERROTTA/CONCLUSA PER: "+a.reason:""));
  L(a.ex.length?"Tentativi di uscita dalla pagina: "+a.ex.length:"Nessun tentativo di uscita dalla pagina");a.ex.forEach(e=>L("  - ore "+e.t+" ("+e.why+") - "+e.res));
  a.sc.forEach(s=>{L("Scheda "+s.k+" - cartina: "+s.map,1);L("  Titolo dato: "+s.tg+" -> "+(s.tok?"CORRETTO":"ERRATO"));s.pk.forEach(x=>L("  "+x.tx+" -> "+(x.ok?"CORRETTA":"ERRATA")));if(s.pk.length<4)L("  Frasi non inserite: "+(4-s.pk.length))})});
 d.save("report_"+S.cogn+"_"+S.nome+".pdf")}
/* controllo uscita */
function viol(why){if(!S.active||S.ov||S.step<3)return;S.ov=Date.now();const e={t:new Date().toLocaleTimeString("it-IT"),why,res:"non ancora rientrato"};S.cur.exits.push(e);S.curEx=e;
 $("#ov").style.display="flex";$("#cnt").textContent=10;
 S.ovt=setInterval(()=>{const r=10-Math.floor((Date.now()-S.ov)/1000);if(r<=0){e.res="NON rientrato entro 10 secondi: attivita' interrotta";grade("interrotta: uscita dall'esercizio")}else $("#cnt").textContent=r},300)}
$("#back").onclick=()=>{if(!S.ov)return;clearInterval(S.ovt);S.curEx.res="rientrato dopo "+Math.round((Date.now()-S.ov)/1000)+" secondi";S.ov=0;$("#ov").style.display="none";
 if(document.fullscreenEnabled&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{})};
document.addEventListener("visibilitychange",()=>{if(document.hidden)viol("cambio finestra/scheda")});
window.addEventListener("blur",()=>setTimeout(()=>{if(!document.hasFocus())viol("finestra non più in primo piano")},50));
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement)viol("uscita dallo schermo intero")});
document.addEventListener("contextmenu",e=>e.preventDefault());
window.addEventListener("beforeunload",e=>{if(S.active){e.preventDefault();e.returnValue=""}});
render();
</script></body></html>
