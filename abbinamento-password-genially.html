<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abbina e sblocca</title>
<style>
  :root { --sf:#eef2f6; --tx:#1f2a37; --ac:#2b6cb0; --acs:#1e4e82; --bd:#cfd8e3; --ok:#2f855a; --er:#c53030; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--sf); color:var(--tx); }
  main { max-width:900px; margin:0 auto; padding:16px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  h1 { margin:0; font-size:1.5rem; }
  h2 { font-size:1.1rem; margin:0 0 8px; }
  section { background:#fff; border:1px solid var(--bd); border-radius:10px; padding:16px; margin-top:16px; }
  [hidden] { display:none !important; }
  button, .btn { font:inherit; padding:9px 16px; border:0; border-radius:8px; background:var(--ac); color:#fff; cursor:pointer; display:inline-block; }
  button:hover, .btn:hover { background:var(--acs); }
  button.sec, .btn.sec { background:#fff; color:var(--ac); border:1px solid var(--ac); }
  button.sec:hover, .btn.sec:hover { background:#e8f0fa; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  :focus-visible { outline:3px solid #f6ad55; outline-offset:2px; }
  textarea, input[type=number], input[type=text] { font:inherit; width:100%; padding:8px; border:1px solid var(--bd); border-radius:8px; }
  textarea { min-height:110px; }
  label { display:block; margin:10px 0 4px; font-weight:600; }
  .riga { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:center; }
  .board { position:relative; display:grid; grid-template-columns:1fr 1fr; gap:0 80px; margin-top:8px; }
  .col { display:flex; flex-direction:column; gap:10px; }
  .item { text-align:left; background:#fff; color:var(--tx); border:2px solid var(--bd); padding:12px; min-height:48px; }
  .item:hover { background:#f3f7fc; }
  .item.sel { border-color:var(--ac); background:#e8f0fa; }
  .item.coll { border-color:#90b4dc; }
  .item.ok { border-color:var(--ok); }
  svg#linee { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  svg#linee line { stroke:var(--ac); stroke-width:3; stroke-linecap:round; pointer-events:stroke; cursor:pointer; }
  #timer { font-weight:700; margin:0; }
  #msg, #msgPsw { min-height:1.4em; margin:10px 0 0; font-weight:600; }
  .err { color:var(--er); } .good { color:var(--ok); }
  #psw { font:700 2.2rem/1.2 ui-monospace,Menlo,Consolas,monospace; letter-spacing:.2em; background:#f0fff4; border:2px dashed var(--ok); border-radius:10px; padding:10px 16px; display:inline-block; user-select:all; }
  @media (max-width:600px) { .board { gap:0 36px; } .item { padding:9px; font-size:.95rem; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Abbina e sblocca</h1>
    <button type="button" class="sec" id="btnDoc">Area docente</button>
  </header>

  <section id="doc" hidden>
    <h2>Area docente</h2>
    <label for="coppie">Coppie da abbinare (una per riga: termine = abbinamento)</label>
    <textarea id="coppie"></textarea>
    <label for="extra">Distrattori (elementi in più a destra, uno per riga)</label>
    <textarea id="extra"></textarea>
    <label for="tempo">Timer in secondi (0 = nessun timer)</label>
    <input type="number" id="tempo" min="0" value="0">
    <div class="riga">
      <button type="button" id="applica">Applica e ricomincia</button>
      <button type="button" class="sec" id="salva">Salva impostazioni (JSON)</button>
      <label class="btn sec" style="margin:0;font-weight:400;">Carica impostazioni<input type="file" id="carica" accept=".json,application/json" hidden></label>
    </div>
  </section>

  <section id="gioco">
    <h2>Collega ogni termine al suo abbinamento</h2>
    <p id="timer"></p>
    <div class="board" id="board">
      <div class="col" id="colL"></div>
      <div class="col" id="colR"></div>
      <svg id="linee" aria-hidden="true"></svg>
    </div>
    <div class="riga">
      <button type="button" id="verifica">Verifica</button>
      <button type="button" class="sec" id="ricomincia">Ricomincia</button>
    </div>
    <p id="msg" role="status"></p>
  </section>

  <section id="sblocco" hidden>
    <h2>Esercizio risolto! Ecco la tua password</h2>
    <div class="riga"><span id="psw"></span><button type="button" class="sec" id="copia">Copia</button></div>
    <label for="inpPsw">Incolla qui la password per aprire la presentazione</label>
    <div class="riga" style="margin-top:0;">
      <input type="text" id="inpPsw" autocomplete="off" style="flex:1;min-width:180px;width:auto;">
      <button type="button" id="apri">Apri presentazione</button>
    </div>
    <p id="msgPsw" role="status"></p>
  </section>

  <section id="pres" hidden>
    <div style="width: 100%;"><div style="position: relative; padding-bottom: 56.25%; padding-top: 0; height: 0;"><iframe id="gen" title="Presentazione Genially" frameborder="0" width="1200" height="675" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" type="text/html" allowscriptaccess="always" allowfullscreen="true" scrolling="yes" allownetworking="all"></iframe></div></div>
  </section>
</main>

<script>
const GENIALLY = 'https://view.genially.com/6afadd796323e220ff107e82';
const $ = id => document.getElementById(id);
let cfg = {
  pairs: [{l:'Italia',r:'Roma'},{l:'Francia',r:'Parigi'},{l:'Spagna',r:'Madrid'},{l:'Germania',r:'Berlino'}],
  extras: ['Lisbona','Vienna'],
  timer: 0
};
let L = [], R = [], conn = new Map(), sel = null, fine = false, pswCorrente = '', tick = null, resto = 0;

function mischia(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function nuovaPassword() {
  const car = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', v = new Uint32Array(6);
  crypto.getRandomValues(v);
  return Array.from(v, n => car[n % car.length]).join('');
}

function avvia() {
  clearInterval(tick);
  L = mischia(cfg.pairs.map((p, i) => ({ id: i, t: p.l, pair: i })));
  R = mischia(cfg.pairs.map((p, i) => ({ id: i, t: p.r, pair: i })).concat(cfg.extras.map((t, i) => ({ id: 100 + i, t, pair: -1 }))));
  conn = new Map(); sel = null; fine = false; pswCorrente = '';
  $('sblocco').hidden = true; $('pres').hidden = true; $('gen').removeAttribute('src');
  $('inpPsw').value = ''; $('msgPsw').textContent = ''; $('msg').textContent = ''; $('msg').className = '';
  $('verifica').disabled = false;
  disegnaElenchi();
  if (cfg.timer > 0) { resto = cfg.timer; mostraTimer(); tick = setInterval(() => { resto--; mostraTimer(); if (resto <= 0) { clearInterval(tick); fine = true; $('verifica').disabled = true; messaggio('Tempo scaduto. Premi Ricomincia per riprovare.', true); disegnaElenchi(); } }, 1000); }
  else $('timer').textContent = '';
}

function mostraTimer() { const m = Math.floor(resto / 60), s = String(resto % 60).padStart(2, '0'); $('timer').textContent = 'Tempo rimasto: ' + m + ':' + s; }
function messaggio(t, errore) { $('msg').textContent = t; $('msg').className = errore ? 'err' : 'good'; }

function disegnaElenchi() {
  [['colL', L, 'l'], ['colR', R, 'r']].forEach(([col, arr, lato]) => {
    const c = $(col); c.innerHTML = '';
    arr.forEach(el => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'item'; b.textContent = el.t; b.dataset.id = el.id; b.dataset.lato = lato; b.disabled = fine;
      b.addEventListener('click', () => clic(lato, el.id));
      c.appendChild(b);
    });
  });
  aggiorna();
}

function clic(lato, id) {
  if (fine) return;
  if (lato === 'l') {
    if (sel === id) { sel = null; }
    else { conn.delete(id); sel = id; }
  } else {
    if (sel !== null) {
      for (const [l, r] of conn) if (r === id) conn.delete(l);
      conn.set(sel, id); sel = null;
    } else {
      for (const [l, r] of conn) if (r === id) conn.delete(l);
    }
  }
  aggiorna();
}

function el(lato, id) { return document.querySelector('.item[data-lato="' + lato + '"][data-id="' + id + '"]'); }

function aggiorna() {
  document.querySelectorAll('.item').forEach(b => {
    const id = Number(b.dataset.id), l = b.dataset.lato === 'l';
    const coll = l ? conn.has(id) : [...conn.values()].includes(id);
    b.classList.toggle('coll', coll);
    b.classList.toggle('sel', l && sel === id);
  });
  disegnaLinee();
}

function disegnaLinee() {
  const svg = $('linee'); svg.innerHTML = '';
  const bb = $('board').getBoundingClientRect();
  conn.forEach((r, l) => {
    const a = el('l', l), c = el('r', r);
    if (!a || !c) return;
    const ra = a.getBoundingClientRect(), rc = c.getBoundingClientRect();
    const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ln.setAttribute('x1', ra.right - bb.left); ln.setAttribute('y1', ra.top + ra.height / 2 - bb.top);
    ln.setAttribute('x2', rc.left - bb.left); ln.setAttribute('y2', rc.top + rc.height / 2 - bb.top);
    ln.addEventListener('click', () => { if (!fine) { conn.delete(l); aggiorna(); } });
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'title'); t.textContent = 'Clicca per cancellare il collegamento';
    ln.appendChild(t); svg.appendChild(ln);
  });
}

$('verifica').addEventListener('click', () => {
  if (fine) return;
  if (conn.size < L.length) { messaggio('Collega tutti i termini di sinistra, poi premi Verifica.', true); return; }
  let errori = 0;
  conn.forEach((r, l) => { const a = L.find(x => x.id === l), b = R.find(x => x.id === r); if (!b || b.pair !== a.pair) errori++; });
  if (errori > 0) { messaggio(errori === 1 ? 'C’è 1 collegamento sbagliato. Riprova.' : 'Ci sono ' + errori + ' collegamenti sbagliati. Riprova.', true); return; }
  fine = true; clearInterval(tick);
  pswCorrente = nuovaPassword();
  $('psw').textContent = pswCorrente;
  $('sblocco').hidden = false;
  $('verifica').disabled = true;
  messaggio('Tutti i collegamenti sono corretti.', false);
  disegnaElenchi();
  document.querySelectorAll('.item').forEach(b => { if (b.classList.contains('coll')) b.classList.add('ok'); });
  $('sblocco').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
});

$('copia').addEventListener('click', () => {
  const fb = () => { const r = document.createRange(); r.selectNodeContents($('psw')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  if (navigator.clipboard) navigator.clipboard.writeText(pswCorrente).then(() => { $('msgPsw').textContent = 'Password copiata.'; $('msgPsw').className = 'good'; }, fb);
  else fb();
});

$('apri').addEventListener('click', () => {
  const v = $('inpPsw').value.trim().toUpperCase();
  if (v && v === pswCorrente) {
    $('msgPsw').textContent = ''; $('pres').hidden = false;
    if (!$('gen').getAttribute('src')) $('gen').setAttribute('src', GENIALLY);
    $('pres').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else { $('msgPsw').textContent = 'Password errata. Controlla di averla copiata bene.'; $('msgPsw').className = 'err'; }
});
$('inpPsw').addEventListener('keydown', e => { if (e.key === 'Enter') $('apri').click(); });
$('ricomincia').addEventListener('click', avvia);

// Area docente
function riempiDocente() {
  $('coppie').value = cfg.pairs.map(p => p.l + ' = ' + p.r).join('\n');
  $('extra').value = cfg.extras.join('\n');
  $('tempo').value = cfg.timer;
}
function leggiDocente() {
  const pairs = $('coppie').value.split('\n').map(s => s.split('=')).filter(a => a.length >= 2 && a[0].trim() && a.slice(1).join('=').trim()).map(a => ({ l: a[0].trim(), r: a.slice(1).join('=').trim() }));
  if (pairs.length < 2) { alert('Inserisci almeno 2 coppie nel formato: termine = abbinamento'); return false; }
  cfg = { pairs, extras: $('extra').value.split('\n').map(s => s.trim()).filter(Boolean), timer: Math.max(0, parseInt($('tempo').value, 10) || 0) };
  return true;
}
$('btnDoc').addEventListener('click', () => { $('doc').hidden = !$('doc').hidden; });
$('applica').addEventListener('click', () => { if (leggiDocente()) avvia(); });
$('salva').addEventListener('click', () => {
  if (!leggiDocente()) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(cfg, null, 2)], { type: 'application/json' }));
  a.download = 'abbinamenti-impostazioni.json'; a.click(); URL.revokeObjectURL(a.href);
});
$('carica').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!Array.isArray(d.pairs) || d.pairs.length < 2) throw 0;
      cfg = { pairs: d.pairs, extras: d.extras || [], timer: d.timer || 0 };
      riempiDocente(); avvia();
    } catch (x) { alert('File non valido.'); }
  };
  rd.readAsText(f); e.target.value = '';
});

window.addEventListener('resize', disegnaLinee);
riempiDocente(); avvia();
</script>
</body>
</html>
